      html += '<div class="doc-sign-hint">' + L(p, c.hintEn || 'AUTHORIZED SIGNATURE', c.hintCn || '授权签字') + '</div>';
    }
    html += '<div class="doc-sign-date-line">' + L(p, 'DATE', '日期') + ': ______________________</div>';
    html += '</div>';
    return html;
  }

  function signatureSection(p) {
    return '<div class="doc-signatures">' +
      signColumn(p, { entity: p.company.nameEn || p.company.nameCn }) +
      stampBlock(p) +
      '</div>';
  }

  function dualSignatureSection(p) {
    var buyerName = txt(p.buyer.nameEn) || txt(p.buyer.nameCn);
    return '<div class="doc-signatures doc-signatures--dual">' +
      signColumn(p, { entity: p.company.nameEn || p.company.nameCn, titleEn: 'FOR AND ON BEHALF OF THE SELLER', titleCn: '卖方签字盖章' }) +
      signColumn(p, { entity: buyerName, showSigner: false, titleEn: 'FOR AND ON BEHALF OF THE BUYER', titleCn: '买方签字盖章' }) +
      stampBlock(p) +
      '</div>';
  }

  function footer(p, totalPages) {
    var total = totalPages || 1;
    var company = txt(p.company.nameEn) || txt(p.company.nameCn);
    var docName = p.chinese
      ? (txt(p.entry.nameCn) + ' / ' + txt(p.entry.nameEn))
      : (txt(p.entry.nameEn) + (biq(p) ? ' / ' + txt(p.entry.nameCn) : ''));
    var pageLabel = p.chinese
      ? '第 <span class="doc-page-no"></span> 页 / 共 ' + total + ' 页'
      : 'PAGE <span class="doc-page-no"></span> OF ' + total;
    return '<footer class="doc-footer">' +
      '<span class="doc-footer-company">' + esc(p, company) + '</span>' +
      '<span class="doc-footer-doc">' + esc(p, docName) + '</span>' +
      '<span class="doc-footer-page">' + pageLabel + '</span>' +
      '</footer>';
  }

  /* ------------------------------------------------------------------ */
  /*  Tables                                                             */
  /* ------------------------------------------------------------------ */

  function itemDescHtml(p, line) {
    var parts = [];
    var name = txt(line.nameEn) || txt(line.nameCn);
    if (hasText(name)) {
      var extras = [];
      if (!biq(p) && hasText(line.code)) extras.push('<span class="doc-item-code">' + esc(p, txt(line.code)) + '</span>');
      if (!biq(p) && hasText(line.specEn)) extras.push('<span class="doc-item-spec">' + esc(p, txt(line.specEn)) + '</span>');
      parts.push('<div class="doc-item-name">' + esc(p, name) + (extras.length ? ' ' + extras.join(' ') : '') + '</div>');
    }
    var nameCn = txt(line.nameCn);
    if (biq(p) && hasText(nameCn) && nameCn !== name) {
      parts.push('<div class="doc-item-sub">' + esc(p, nameCn) + '</div>');
    }
    if (hasText(line.remarks)) parts.push('<div class="doc-item-note">' + esc(p, txt(line.remarks)) + '</div>');
    return parts.join('');
  }

  function emptyRow(p, cols) {
    return '<tr><td colspan="' + cols + '" class="doc-empty">' + L(p, 'NO ITEMS RECORDED', '暂无货物明细') + '</td></tr>';
  }

  function invoiceItemsTable(p) {
    var head = '<thead><tr>' +
      '<th class="doc-col-no">' + L(p, 'NO.', '序号') + '</th>' +
      '<th class="doc-col-desc">' + L(p, 'DESCRIPTION OF GOODS', '货物名称') + '</th>' +
      '<th class="doc-col-hs">' + L(p, 'HS CODE', '海关编码') + '</th>' +
      '<th class="doc-col-qty doc-r">' + L(p, 'QTY', '数量') + '</th>' +
      '<th class="doc-col-unit">' + L(p, 'UNIT', '单位') + '</th>' +
      '<th class="doc-col-price doc-r">' + L(p, 'UNIT PRICE (' + txt(p.currency) + ')', '单价') + '</th>' +
      '<th class="doc-col-amount doc-r">' + L(p, 'AMOUNT (' + txt(p.currency) + ')', '金额') + '</th>' +
      '</tr></thead>';
    var rows = [];
    var lines = p.calc.lines || [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      rows.push('<tr>' +
        '<td class="doc-c">' + (i + 1) + '</td>' +
        '<td class="doc-cell-desc">' + itemDescHtml(p, line) + '</td>' +
        '<td class="doc-c">' + esc(p, txt(line.hsCode)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtQty(line.qty)) + '</td>' +
        '<td class="doc-c">' + esc(p, txt(line.unit)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.unitPrice, 2)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.amount, 2)) + '</td>' +
        '</tr>');
    }
    if (!rows.length) rows.push(emptyRow(p, 7));
    return '<table class="doc-table doc-table--items invoice-table"><colgroup>' +
      '<col class="doc-col-no"><col class="doc-col-desc"><col class="doc-col-hs">' +
      '<col class="doc-col-qty"><col class="doc-col-unit"><col class="doc-col-price"><col class="doc-col-amount">' +
      '</colgroup>' + head + '<tbody>' + rows.join('') + '</tbody></table>';
  }

  function totalRows(p) {
    var c = p.calc;
    var rows = [
      { en: 'MERCHANDISE TOTAL', cn: '货值合计', value: p.core.fmtMoney(c.merchandiseTotal, p.currency) }
    ];
    if (c.freight) rows.push({ en: 'FREIGHT', cn: '运费', value: p.core.fmtMoney(c.freight, p.currency) });
    if (c.insurance) rows.push({ en: 'INSURANCE', cn: '保险费', value: p.core.fmtMoney(c.insurance, p.currency) });
    if (c.other) rows.push({ en: 'OTHER CHARGES', cn: '其他费用', value: p.core.fmtMoney(c.other, p.currency) });
    if (c.discount) rows.push({ en: 'DISCOUNT', cn: '折扣', value: p.core.fmtMoney(-c.discount, p.currency) });
    rows.push({ en: 'TOTAL AMOUNT', cn: '合计金额', value: p.core.fmtMoney(c.grandTotal, p.currency), strong: true });
    return rows;
  }

  function totalsTable(p, rows) {
    var html = '<table class="doc-table doc-table--totals"><tbody>';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr' + (rows[i].strong ? ' class="doc-totals-strong"' : '') + '>' +
        '<th>' + L(p, rows[i].en, rows[i].cn) + '</th>' +
        '<td class="doc-r">' + esc(p, rows[i].value) + '</td>' +
        '</tr>';
    }
    return html + '</tbody></table>';
  }

  function amountWordsBlock(p, cfg) {
    var c = cfg || {};
    var html = '<div class="doc-amount-words">' +
      '<div class="doc-amount-words-label">' + L(p, c.enLabel || 'AMOUNT IN WORDS', c.cnLabel || '金额大写') + '</div>' +
      '<div class="doc-amount-words-value">' + esc(p, p.calc.amountInWordsEn) + '</div>';
    if (c.cn === true) {
      html += '<div class="doc-amount-words-cn">' + esc(p, p.calc.amountInWordsCn) + '</div>';
    }
    return html + '</div>';
  }

  function invoiceSummary(p, cfg) {
    var c = cfg || {};
    return '<div class="doc-summary">' +
      '<div class="doc-summary-words">' + amountWordsBlock(p, { cn: c.cnWords === true }) + '</div>' +
      '<div class="doc-summary-totals">' + totalsTable(p, totalRows(p)) + '</div>' +
      '</div>';
  }

  function bankBlock(p) {
    var b = p.bank || {};
    var rows = [
      ['BENEFICIARY', '收款人', txt(b.beneficiaryEn) || txt(p.company.nameEn)],
      ['BANK NAME', '开户银行', b.bankNameEn],
      ['BANK ADDRESS', '银行地址', b.bankAddressEn],
      ['ACCOUNT NO.', '银行账号', b.accountNo],
      ['SWIFT CODE', 'SWIFT 代码', b.swift],
      ['IBAN', 'IBAN', b.iban],
      ['INTERMEDIARY BANK', '中转银行', b.intermediary]
    ];
    var any = false;
    for (var i = 0; i < rows.length; i++) {
      if (hasText(rows[i][2])) { any = true; break; }
    }
    if (!any) return '';
    var html = '<div class="doc-bank">' +
      blockTitle(p, 'BANKING DETAILS', '银行信息') +
      '<div class="doc-bank-grid">';
    for (var j = 0; j < rows.length; j++) {
      if (!hasText(rows[j][2])) continue;
      var label = esc(p, rows[j][0]);
      html += '<div class="doc-bank-item">' +
        '<span class="doc-bank-label">' + label + '</span>' +
        '<span class="doc-bank-value">' + esc(p, txt(rows[j][2])) + '</span>' +
        '</div>';
    }
    return html + '</div></div>';
  }

  /* ------------------------------------------------------------------ */
  /*  Common detail rows                                                 */
  /* ------------------------------------------------------------------ */

  function shipmentRows(p) {
    return [
      ['INCOTERM', '贸易术语', incoterm(p)],
      ['PORT OF LOADING', '起运港', portOfLoading(p)],
      ['PORT OF DISCHARGE', '目的港', portOfDischarge(p)],
      ['FINAL DESTINATION', '最终目的地', txt(p.order.finalDestination)],
      ['VESSEL / VOYAGE', '船名航次', vesselText(p)],
      ['TRANSPORT MODE', '运输方式', transportEn(p)],
      ['ETD', '预计开船日', dateText(p, p.order.etd)],
      ['COUNTRY OF ORIGIN', '原产国', originValue(p)]
    ];
  }

  /* ------------------------------------------------------------------ */
  /*  Sheet / page wrappers                                              */
  /* ------------------------------------------------------------------ */

  function sheet(p, body, extraClass) {
    return '<article class="doc-sheet doc-sheet--' + p.key +
      (p.bilingual ? ' doc-sheet--bilingual' : '') +
      (extraClass ? ' ' + extraClass : '') +
      '" data-doc="' + p.key + '" role="document" aria-label="' + esc(p, p.entry.nameEn) + '">' +
      body + '</article>';
  }

  function pageStart(p, extraClass) {
    return '<div class="doc-page' + (extraClass ? ' ' + extraClass : '') + '">';
  }

  function pageEnd() {
    return '</div>';
  }

  /* ------------------------------------------------------------------ */
  /*  prepare() + render()                                               */
  /* ------------------------------------------------------------------ */

  function prepare(key, ctx) {
    var core = ctx && ctx.core;
    if (!core || typeof core.esc !== 'function' || typeof core.calcOrder !== 'function') {
      throw new TypeError('TradeDocs.docs.render(key, ctx): ctx.core (TradeDocs.core) is required');
    }
    var entry = findEntry(key);
    if (!entry) {
      throw new Error('TradeDocs.docs.render: unknown document type "' + txt(key) + '"');
    }
    var state = ctx.state || {};
    var settings = state.settings || {};
    var order = ctx.order || {};
    var meta = ctx.meta || {};
    var opts = ctx.opts || {};
    var p = {
      key: key,
      entry: entry,
      core: core,
      state: state,
      settings: settings,
      order: order,
      meta: meta,
      opts: opts,
      company: settings.company || {},
      bank: settings.bank || {},
      defaults: settings.defaults || {},
      buyer: order.buyer || {},
      calc: core.calcOrder(order),
      cost: core.calcCost(order),
      currency: txt(order.currency) || txt((settings.defaults || {}).currency) || 'USD',
      bilingual: opts.bilingual === true,
      showSeal: opts.showSeal !== false,
      showSignature: opts.showSignature !== false,
      chinese: key === 'cd' || key === 'cs',
      alwaysBi: key === 'bk' || key === 'cd' || key === 'cs',
      dateISO: hasText(meta.date) ? txt(meta.date) : txt(order.date),
      dateText: ''
    };
    p.dateText = dateText(p, p.dateISO);
    return p;
  }

  function render(key, ctx) {
    var p = prepare(key, ctx);
    var renderer = RENDERERS[p.key];
    return renderer(p);
  }

  /* ------------------------------------------------------------------ */
  /*  Render dispatch (template functions are hoisted below)             */
  /* ------------------------------------------------------------------ */

  var RENDERERS = {
    ci: renderCI,
    pl: renderPL,
    pi: renderPI,
    sc: renderSC,
    qt: renderQT,
    bk: renderBK,
    sa: renderSA,
    cd: renderCD,
    co: renderCO,
    bc: renderBC,
    dr: renderDR,
    cs: renderCS
  };

  /* ================================================================== */
  /*  CI — Commercial Invoice (§7.1)                                     */
  /* ================================================================== */

  function renderCI(p) {
    var meta = [
      ['INVOICE NO.', '发票号', p.meta.no],
      ['DATE', '日期', p.dateText],
      ['CONTRACT NO.', '合同号', contractNo(p)],
      ['L/C NO.', '信用证号', txt(p.order.lcNo)],
      ['L/C DATE', '开证日期', dateText(p, p.order.lcDate)],
      ['INCOTERM', '贸易术语', incoterm(p)],
      ['CURRENCY', '币制', p.currency],
      ['TRANSPORT', '运输方式', transportEn(p)]
    ];
    var parties = partiesRow(p, [
      ['BUYER', '买方', p.buyer],
      ['CONSIGNEE', '收货人', consigneeParty(p)],
      ['NOTIFY PARTY', '通知人', notifyParty(p)]
    ]);
    var shipment = detailsGrid(p, [
      ['PORT OF LOADING', '起运港', portOfLoading(p)],
      ['PORT OF DISCHARGE', '目的港', portOfDischarge(p)],
      ['FINAL DESTINATION', '最终目的地', txt(p.order.finalDestination)],
      ['COUNTRY OF DESTINATION', '目的国', destinationCountry(p)],
      ['VESSEL / VOYAGE', '船名航次', vesselText(p)],
      ['ETD', '预计开船日', dateText(p, p.order.etd)],
      ['COUNTRY OF ORIGIN', '原产国', originValue(p)],
      ['L/C ISSUING BANK', '开证银行', p.order.lcIssuingBank]
    ]);
    var bottomMain = declarationBlock(p, p.defaults.declaration);
    var body =
      letterhead(p) +
      titleBlock(p) +
      metaGrid(p, meta) +
      parties +
      shipment +
      '<div class="doc-duo">' + marksBlock(p) + paymentBlock(p) + '</div>' +
      invoiceItemsTable(p) +
      invoiceSummary(p, { cnWords: p.bilingual }) +
      '<div class="doc-bottom">' +
        '<div class="doc-bottom-main">' + bottomMain + '</div>' +
        '<div class="doc-bottom-side">' + signatureSection(p) + '</div>' +
      '</div>' +
      footer(p, 1);
    return sheet(p, pageStart(p) + body + pageEnd());
  }

  /* ================================================================== */
  /*  PL — Packing List (§7.2, no prices)                                */
  /* ================================================================== */

  function packingTable(p) {
    var head = '<thead><tr>' +
      '<th class="doc-col-no">' + L(p, 'NO.', '序号') + '</th>' +
      '<th class="doc-col-desc">' + L(p, 'DESCRIPTION OF GOODS', '货物名称') + '</th>' +
      '<th class="doc-col-cno">' + L(p, 'CARTON NOS.', '箱号') + '</th>' +
      '<th class="doc-col-qty doc-r">' + L(p, 'CTNS', '箱数') + '</th>' +
      '<th class="doc-col-qty doc-r">' + L(p, 'QTY/CTN', '每箱数量') + '</th>' +
      '<th class="doc-col-qty doc-r">' + L(p, 'TOTAL QTY', '总数量') + '</th>' +
      '<th class="doc-col-w doc-r">' + L(p, 'N.W. (KGS)', '净重') + '</th>' +
      '<th class="doc-col-w doc-r">' + L(p, 'G.W. (KGS)', '毛重') + '</th>' +
      '<th class="doc-col-cbm doc-r">' + L(p, 'MEAS. (CBM)', '体积') + '</th>' +
      '</tr></thead>';
    var lines = p.calc.lines || [];
    var rows = [];
    var cursor = 1;
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var ctns = Math.round(p.core.num(line.cartonsCalc, 0));
      var range = '';
      if (ctns > 0) {
        range = cursor + ' - ' + (cursor + ctns - 1);
        cursor += ctns;
      }
      rows.push('<tr>' +
        '<td class="doc-c">' + (i + 1) + '</td>' +
        '<td class="doc-cell-desc">' + itemDescHtml(p, line) + '</td>' +
        '<td class="doc-c">' + esc(p, range) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtQty(line.cartonsCalc)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtQty(line.qtyPerCarton)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtQty(line.qty)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.netWeightTotal, 3)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.grossWeightTotal, 3)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.cbmTotal, 3)) + '</td>' +
        '</tr>');
    }
    if (!rows.length) rows.push(emptyRow(p, 9));
    var c = p.calc;
    var foot = '<tfoot><tr class="doc-totals-strong">' +
      '<td colspan="3">' + L(p, 'TOTAL', '合计') + '</td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtQty(c.totalCartons)) + '</td>' +
      '<td class="doc-r"></td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtQty(c.totalQty)) + '</td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtNum(c.totalNetWeight, 3)) + '</td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtNum(c.totalGrossWeight, 3)) + '</td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtNum(c.totalCbm, 3)) + '</td>' +
      '</tr></tfoot>';
    return '<table class="doc-table doc-table--items packing-table"><colgroup>' +
      '<col class="doc-col-no"><col class="doc-col-desc"><col class="doc-col-cno">' +
      '<col class="doc-col-qty"><col class="doc-col-qty"><col class="doc-col-qty">' +
      '<col class="doc-col-w"><col class="doc-col-w"><col class="doc-col-cbm">' +
      '</colgroup>' + head + '<tbody>' + rows.join('') + '</tbody>' + foot + '</table>';
  }

  function statsRow(p, items) {
    var html = '<div class="doc-stats">';
    for (var i = 0; i < items.length; i++) {
      html += '<div class="doc-stat">' +
        '<div class="doc-stat-value">' + esc(p, items[i][2]) + '</div>' +
        '<div class="doc-stat-label">' + L(p, items[i][0], items[i][1]) + '</div>' +
        '</div>';
    }
    return html + '</div>';
  }

  function renderPL(p) {
    var meta = [
      ['PACKING LIST NO.', '装箱单号', p.meta.no],
      ['DATE', '日期', p.dateText],
      ['INVOICE NO.', '发票号', invoiceNo(p)],
      ['CONTRACT NO.', '合同号', contractNo(p)]
    ];
    var parties = partiesRow(p, [
      ['BUYER', '买方', p.buyer],
      ['CONSIGNEE', '收货人', consigneeParty(p)]
    ], 'doc-parties--2');
    var shipment = detailsGrid(p, [
      ['PORT OF LOADING', '起运港', portOfLoading(p)],
      ['PORT OF DISCHARGE', '目的港', portOfDischarge(p)],
      ['FINAL DESTINATION', '最终目的地', txt(p.order.finalDestination)],
      ['VESSEL / VOYAGE', '船名航次', vesselText(p)],
      ['ETD', '预计开船日', dateText(p, p.order.etd)],
      ['COUNTRY OF ORIGIN', '原产国', originValue(p)],
      ['COUNTRY OF DESTINATION', '目的国', destinationCountry(p)],
      ['INCOTERM', '贸易术语', incoterm(p)]
    ]);
    var stats = statsRow(p, [
      ['TOTAL CARTONS', '总箱数', p.core.fmtQty(p.calc.totalCartons) + ' CARTONS'],
      ['TOTAL NET WEIGHT', '总净重', p.core.fmtNum(p.calc.totalNetWeight, 3) + ' KGS'],
      ['TOTAL GROSS WEIGHT', '总毛重', p.core.fmtNum(p.calc.totalGrossWeight, 3) + ' KGS'],
      ['TOTAL MEASUREMENT', '总体积', p.core.fmtNum(p.calc.totalCbm, 3) + ' CBM']
    ]);
    var body =
      letterhead(p) +
      titleBlock(p) +
      metaGrid(p, meta) +
      parties +
      shipment +
      '<div class="doc-duo">' + marksBlock(p) +
        noteBlock(p, 'PACKING NOTE', '包装说明', 'THE GOODS ARE PACKED IN EXPORT-STANDARD CARTONS SUITABLE FOR LONG-DISTANCE OCEAN TRANSPORT AND PROTECTED AGAINST MOISTURE AND ROUGH HANDLING.') +
      '</div>' +
      packingTable(p) +
      stats +
      remarksBlock(p) +
      signatureSection(p) +
      footer(p, 1);
    return sheet(p, pageStart(p) + body + pageEnd());
  }

  /* ================================================================== */
  /*  PI — Proforma Invoice (§7.3)                                       */
  /* ================================================================== */

  function validityText(p) {
    var until = addDays(p, p.dateISO, 30);
    if (hasText(until)) return 'VALID UNTIL ' + until + ' (30 DAYS FROM THE DATE OF THIS INVOICE).';
    return '30 DAYS FROM THE DATE OF THIS PROFORMA INVOICE.';
  }

  function deliveryText(p) {
    var etd = dateText(p, p.order.etd);
    if (hasText(etd)) return 'ON OR ABOUT ' + etd + ', SUBJECT TO ORDER CONFIRMATION.';
    return 'WITHIN 30 DAYS AFTER RECEIPT OF THE DOWN PAYMENT.';
  }

  function renderPI(p) {
    var meta = [
      ['PROFORMA INVOICE NO.', '形式发票号', p.meta.no],
      ['DATE', '日期', p.dateText],
      ['CONTRACT NO.', '合同号', contractNo(p)],
      ['L/C NO.', '信用证号', txt(p.order.lcNo)],
      ['L/C DATE', '开证日期', dateText(p, p.order.lcDate)],
      ['L/C ISSUING BANK', '开证银行', txt(p.order.lcIssuingBank)],
      ['INCOTERM', '贸易术语', incoterm(p)],
      ['CURRENCY', '币制', p.currency]
    ];
    var parties = partiesRow(p, [
      ['BUYER', '买方', p.buyer],
      ['CONSIGNEE', '收货人', consigneeParty(p)],
      ['NOTIFY PARTY', '通知人', notifyParty(p)]
    ]);
    var shipment = detailsGrid(p, [
      ['PORT OF LOADING', '起运港', portOfLoading(p)],
      ['PORT OF DISCHARGE', '目的港', portOfDischarge(p)],
      ['FINAL DESTINATION', '最终目的地', txt(p.order.finalDestination)],
      ['COUNTRY OF DESTINATION', '目的国', destinationCountry(p)],
      ['VESSEL / VOYAGE', '船名航次', vesselText(p)],
      ['ETD', '预计开船日', dateText(p, p.order.etd)],
      ['COUNTRY OF ORIGIN', '原产国', originValue(p)],
      ['DELIVERY TIME', '交货期', deliveryText(p)]
    ]);
    var termsNote = noteBlock(p, 'TERMS & VALIDITY', '条款与有效期',
      validityText(p) +
      '\nPAYMENT TERMS: ' + (hasText(paymentTerms(p)) ? paymentTerms(p) : 'TO BE CONFIRMED') +
      '\nTHIS PROFORMA INVOICE IS ISSUED FOR THE BUYER\'S CONFIRMATION ONLY AND IS NOT A TAX INVOICE.');

  function containerSuggestion(p) {

    if (!(cbm > 0)) return '';

    return Math.ceil(cbm / 68) + " × 40'HC";
  }

  /* ================================================================== */

  function cdDescHtml(p, line) {
    var cn = txt(line.nameCn);
    var en = txt(line.nameEn);
    var name = cn || en;
    if (!hasText(name)) return '';
    var inline = [];
    if (hasText(en) && en !== name) inline.push('<span class="doc-item-code">' + esc(p, en) + '</span>');
    if (hasText(line.code)) inline.push('<span class="doc-item-code">' + esc(p, txt(line.code)) + '</span>');
    return '<div class="doc-item-name">' + esc(p, name) + (inline.length ? ' ' + inline.join(' ') : '') + '</div>';
  }

  /* ================================================================== */
  /*  DR — Bill of Exchange (§7.11)                                      */
  /* ================================================================== */

  function tenorText(p) {
    var terms = paymentTerms(p).toUpperCase();
    var m = terms.match(/(\d+)\s*DAYS?/);
    if (m && m[1]) return 'AT ' + String(Number(m[1])) + ' DAYS AFTER SIGHT';
    if (/SIGHT/.test(terms)) return 'AT SIGHT';
    return 'AT SIGHT';
  }

  function draweeText(p) {
    if (hasText(p.order.lcIssuingBank)) return txt(p.order.lcIssuingBank);
    var name = txt(p.buyer.nameEn) || txt(p.buyer.nameCn);
    var addr = txt(p.buyer.addressEn) || txt(p.buyer.addressCn);
    return [name, addr].filter(hasText).join('\n');
  }

  function payeeText(p) {
    return txt(p.bank.bankNameEn) || txt(p.company.nameEn) || txt(p.company.nameCn);
  }

      '<div class="doc-bottom">' +
        '<div class="doc-bottom-main">' +
          '<div class="doc-endorsement"><div class="doc-block-title">' + L(p, 'ENDORSEMENTS', '背书') + '</div><div class="doc-endorsement-lines"></div></div>' +
        '</div>' +
        '<div class="doc-bottom-side">' +
          '<div class="doc-drawer">' +
            '<div class="doc-sign-caption">' + L(p, 'DRAWER / SIGNATURE AND STAMP', '出票人签字盖章') + '</div>' +
            '<div class="doc-sign-line"></div>' +
            '<div class="doc-sign-company">' + esc(p, txt(p.company.nameEn) || txt(p.company.nameCn)) + '</div>' +
            (p.showSignature && (hasText(p.company.signer) || hasText(p.company.signerTitle))
              ? '<div class="doc-sign-name">' + esc(p, txt(p.company.signer)) +
                (hasText(p.company.signerTitle) ? '<span class="doc-sign-title">' + esc(p, txt(p.company.signerTitle)) + '</span>' : '') +
                '</div>'
              : '<div class="doc-sign-hint">' + L(p, 'AUTHORIZED SIGNATURE', '授权签字') + '</div>') +
            stampBlock(p) +
          '</div>' +
        '</div>' +
      '</div>' +
      footer(p, 1);
    return sheet(p, pageStart(p) + body + pageEnd());
  }

  /* ================================================================== */
  /*  CS — Cost Sheet, Chinese internal (§7.12)                          */
  /* ================================================================== */

  function csCostTable(p) {
    var cost = p.cost;
    var rows = [
      { cn: '采购成本', en: 'PURCHASE COST', value: cost.purchaseCost },
      { cn: '国内费用', en: 'DOMESTIC EXPENSES', value: cost.domesticCost },
      { cn: '银行费用', en: 'BANK CHARGES', value: cost.bankCost },
      { cn: '其他费用', en: 'OTHER EXPENSES', value: cost.miscCost }
    ];
    var html = '<table class="doc-table doc-table--cost"><colgroup><col><col class="doc-col-amount"></colgroup>' +
      '<thead><tr><th>项目 <span class="doc-bi-en">ITEM</span></th><th class="doc-r">金额（人民币 CNY）<span class="doc-bi-en">AMOUNT (CNY)</span></th></tr></thead><tbody>';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr><td>' + esc(p, rows[i].cn) + '<span class="doc-bi-en">' + esc(p, rows[i].en) + '</span></td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(rows[i].value, 2)) + '</td></tr>';
    }
    html += '<tr class="doc-totals-strong"><td>成本合计 <span class="doc-bi-en">TOTAL COST</span></td><td class="doc-r">' + esc(p, p.core.fmtNum(cost.totalCost, 2)) + '</td></tr>';
    return html + '</tbody></table>';
  }

  function csDescHtml(p, line) {
    var name = txt(line.nameCn) || txt(line.nameEn);
    return '<div class="doc-item-name">' + esc(p, name) + '</div>';
  }

  function csLineTable(p) {
    var rate = p.cost.exchangeRate;
    var head = '<thead><tr>' +
      '<th class="doc-col-no">序号</th>' +
      '<th class="doc-col-desc">品名<span class="doc-bi-en">ITEM</span></th>' +
      '<th class="doc-col-qty doc-r">数量<span class="doc-bi-en">QTY</span></th>' +
      '<th class="doc-col-qty doc-r">采购单价（RMB）<span class="doc-bi-en">UNIT COST</span></th>' +
      '<th class="doc-col-amount doc-r">采购成本（RMB）<span class="doc-bi-en">PURCHASE COST</span></th>' +
      '<th class="doc-col-qty doc-r">外销单价<span class="doc-bi-en">UNIT PRICE</span></th>' +
      '<th class="doc-col-amount doc-r">外销金额<span class="doc-bi-en">AMOUNT</span></th>' +
      '<th class="doc-col-amount doc-r">单件毛利（RMB）<span class="doc-bi-en">UNIT GP</span></th>' +
      '</tr></thead>';
    var rows = [];
    var lines = p.calc.lines || [];
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var purchase = p.core.round(p.core.num(line.qty, 0) * p.core.num(line.costPrice, 0), 2);
      var unitGp = p.core.round(p.core.num(line.unitPrice, 0) * rate - p.core.num(line.costPrice, 0), 2);
      rows.push('<tr>' +
        '<td class="doc-c">' + (i + 1) + '</td>' +
        '<td class="doc-cell-desc">' + csDescHtml(p, line) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtQty(line.qty)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.costPrice, 2)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(purchase, 2)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.unitPrice, 2)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(line.amount, 2)) + '</td>' +
        '<td class="doc-r">' + esc(p, p.core.fmtNum(unitGp, 2)) + '</td>' +
        '</tr>');
    }
    if (!rows.length) rows.push(emptyRow(p, 8));
    return '<table class="doc-table doc-table--items cost-lines"><colgroup>' +
      '<col class="doc-col-no"><col class="doc-col-desc"><col class="doc-col-qty"><col class="doc-col-qty">' +
      '<col class="doc-col-amount"><col class="doc-col-qty"><col class="doc-col-amount"><col class="doc-col-amount">' +
      '</colgroup>' + head + '<tbody>' + rows.join('') + '</tbody></table>';
  }

  function renderCS(p) {
    var cost = p.cost;
    var profitWord = cost.grossProfit >= 0 ? '盈利 PROFIT' : '亏损 LOSS';
    var advice = cost.marginPct >= 15
      ? '毛利率健康，可按现价执行。'
      : (cost.marginPct > 0
        ? '毛利偏低，建议复核采购成本或调整报价。'
        : '存在亏损风险，建议暂缓执行并重新核算成本。');
    var meta = [
      ['COST SHEET NO.', '核算表编号', p.meta.no],
      ['ORDER NO.', '订单号', txt(p.order.no)],
      ['CUSTOMER', '客户', txt(p.buyer.nameEn) || txt(p.buyer.nameCn)],
      ['DATE', '制表日期', p.dateText],
      ['CURRENCY', '币制', p.currency],
      ['EXCHANGE RATE', '汇率', p.core.fmtNum(cost.exchangeRate, 4)]
    ];
    var incomeTable = '<table class="doc-table doc-table--cost"><colgroup><col><col class="doc-col-amount"><col class="doc-col-qty"><col class="doc-col-amount"></colgroup>' +
      '<thead><tr><th>项目 <span class="doc-bi-en">ITEM</span></th>' +
      '<th class="doc-r">外销收入 <span class="doc-bi-en">REVENUE</span></th>' +
      '<th class="doc-r">汇率 <span class="doc-bi-en">RATE</span></th>' +
      '<th class="doc-r">折人民币（CNY）<span class="doc-bi-en">REVENUE (CNY)</span></th></tr></thead>' +
      '<tbody><tr><td>外销收入 <span class="doc-bi-en">EXPORT REVENUE</span></td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtMoney(cost.revenueFc, p.currency)) + '</td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtNum(cost.exchangeRate, 4)) + '</td>' +
      '<td class="doc-r">' + esc(p, p.core.fmtNum(cost.revenueCny, 2)) + '</td></tr></tbody></table>';
    var stats = '<div class="doc-stats doc-stats--3">' +
      '<div class="doc-stat"><div class="doc-stat-value">' + esc(p, p.core.fmtNum(cost.grossProfit, 2)) + '</div><div class="doc-stat-label">毛利（人民币）<span class="doc-bi-en">GROSS PROFIT (CNY)</span></div></div>' +
      '<div class="doc-stat"><div class="doc-stat-value">' + esc(p, p.core.fmtNum(cost.marginPct, 2)) + '%</div><div class="doc-stat-label">毛利率<span class="doc-bi-en">MARGIN</span></div></div>' +
      '<div class="doc-stat"><div class="doc-stat-value doc-stat-value--sm">' + esc(p, profitWord) + '</div><div class="doc-stat-label">盈亏判断<span class="doc-bi-en">RESULT</span></div></div>' +
      '</div>';
    var words = '<div class="doc-amount-words doc-amount-words--cn">' +
      '<div class="doc-amount-words-label">人民币大写<span class="doc-bi-en">AMOUNT IN WORDS (CNY)</span></div>' +
      '<div class="doc-amount-words-value">' + esc(p, p.core.amountWordsCn(cost.revenueCny, 'CNY')) + '</div>' +
      '</div>';
    var remark = '本单外销收入人民币 ' + p.core.fmtNum(cost.revenueCny, 2) + '，总成本 ' + p.core.fmtNum(cost.totalCost, 2) +
      '，毛利 ' + p.core.fmtNum(cost.grossProfit, 2) + '，毛利率 ' + p.core.fmtNum(cost.marginPct, 2) + '%。' + advice;
    var signArea = zhSignRow(p);
    var body =
      letterhead(p) +
      titleBlock(p, { zh: true }) +
      '<div class="doc-internal">内部资料 · INTERNAL USE ONLY</div>' +
      metaGrid(p, meta, 'doc-meta-grid--3', true) +
      sectionTitle(p, 'REVENUE', '收入', true) +
      incomeTable +
      sectionTitle(p, 'COST', '成本', true) +
      csCostTable(p) +
      stats +
      sectionTitle(p, 'UNIT COST / PRICE', '单件成本与售价', true) +
      csLineTable(p) +
      words +
      noteBlock(p, 'ANALYSIS', '核算结论', remark, true) +
      '<div class="doc-bottom doc-bottom--cd">' +
        '<div class="doc-bottom-main">' + signArea + '</div>' +
        '<div class="doc-bottom-side">' + (p.showSeal ? stampBlock(p) : '') + '</div>' +
      '</div>' +
      footer(p, 1);
    return sheet(p, pageStart(p) + body + pageEnd());
  }

  return {
    version: VERSION,
    groups: GROUPS,
    list: LIST,
    get: get,
    render: render
  };
});

</script>
  <script data-source="js/store.js">
/* ---- js/store.js ---- */
/*!
 * 单证通 TradeDocs — store.js
 * Local-first state container: localStorage persistence, demo seeding,
 * corrupt-data recovery, debounced autosave, CRUD, document numbering and backup.
 * Classic script (no modules). Exposes window.TradeDocs.store.
 */
(function (root) {
  'use strict';

  var TD = root.TradeDocs = root.TradeDocs || {};
  var core = TD.core;

  if (!core) {
    // core.js is a hard dependency. Fail loudly but do not break the page.
    (root.console || { error: function () {} }).error('[TradeDocs] core.js must be loaded before store.js');
    TD.store = {
      storageKey: 'tradedocs.v1',
      getState: function () { return null; },
      setState: function () { return null; },
      subscribe: function () { return function () {}; },
      save: function () {},
      newOrder: function () { return null; },
      saveOrder: function () { return null; },
      deleteOrder: function () { return false; },
      duplicateOrder: function () { return null; },
      ensureDocMeta: function () { return { no: '', date: '' }; },
      exportJSON: function () { return '{}'; },
      importJSON: function () { return { ok: false, message: '核心脚本未加载' }; },
      resetDemo: function () {},
      clearAll: function () {}
    };
    return;
  }

  /* ------------------------------------------------------------------ */
  /*  Constants                                                          */
  /* ------------------------------------------------------------------ */

  var STORAGE_KEY = 'tradedocs.v1';
  var BROKEN_KEY = 'tradedocs.broken';
  var SCHEMA_VERSION = 1;
  var SAVE_DELAY = 300; // ms — contract: <= 500ms

  var DOC_KEYS = ['ci', 'pl', 'pi', 'sc', 'qt', 'bk', 'sa', 'cd', 'co', 'bc', 'dr', 'cs'];
  var DOC_PREFIX = {
    ci: 'CI', pl: 'PL', pi: 'PI', sc: 'SC', qt: 'QT', bk: 'BK', sa: 'SA',
    cd: 'CD', co: 'CO', bc: 'BC', dr: 'DR', cs: 'CS'
  };

  var ITEM_STRING_FIELDS = ['code', 'nameEn', 'nameCn', 'hsCode', 'origin', 'unit', 'remarks'];
  var ITEM_NUMBER_FIELDS = ['qty', 'unitPrice', 'cartons', 'qtyPerCarton', 'netWeight', 'grossWeight', 'cbm', 'costPrice'];
  var CHARGE_FIELDS = ['freight', 'insurance', 'other', 'discount'];
  var COST_FIELDS = ['exchangeRate', 'domestic', 'bank', 'misc'];
  var BUYER_FIELDS = ['nameEn', 'nameCn', 'addressEn', 'addressCn', 'country', 'contact', 'tel', 'email', 'taxId'];
  var CUSTOMER_FIELDS = ['id', 'code', 'nameEn', 'nameCn', 'addressEn', 'addressCn', 'country', 'contact', 'tel', 'email', 'taxId'];
  var PRODUCT_STRING_FIELDS = ['id', 'code', 'nameEn', 'nameCn', 'hsCode', 'unit', 'currency', 'pkg', 'origin', 'specEn', 'remarks'];
  var PRODUCT_NUMBER_FIELDS = ['price', 'qtyPerCarton', 'netWeight', 'grossWeight', 'cbm'];

  /* ------------------------------------------------------------------ */
  /*  Internal state                                                     */
  /* ------------------------------------------------------------------ */

  var state = null;
  var changeListeners = [];
  var noticeListeners = [];
  var noticeQueue = [];
  var saveStateListeners = [];
  var saveTimer = null;
  var storageAvailable = true;
  var writeFailureNotified = false;
  var lastSaveStatus = { status: 'saved', at: Date.now() };

  /* ------------------------------------------------------------------ */
  /*  Small helpers                                                      */
  /* ------------------------------------------------------------------ */

  function clone(value) { return core.clone(value); }

  function str(value) {
    if (value === null || value === undefined) return '';
    return String(value);
  }

  function isPlainObject(value) {
    return !!value && typeof value === 'object' && !Array.isArray(value);
  }

  function nowISO() {
    var d = new Date();
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
      'T' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  }

  function deepAssign(target, source) {
    if (!isPlainObject(source)) return target;
    Object.keys(source).forEach(function (key) {
      var value = source[key];
      if (isPlainObject(value) && isPlainObject(target[key])) {
        deepAssign(target[key], value);
      } else if (value !== undefined) {
        target[key] = clone(value);
      }
    });
    return target;
  }

  function emitChange(previous) {
    var snapshot = state;
    changeListeners.slice().forEach(function (fn) {
      try {
        fn(snapshot, previous);
      } catch (err) {
        if (root.console) root.console.error('[TradeDocs] store subscriber failed', err);
      }
    });
  }

  function emitStatus(status) {
    lastSaveStatus = { status: status, at: Date.now() };
    saveStateListeners.slice().forEach(function (fn) {
      try { fn(status); } catch (err) { /* ignore */ }
    });
  }

  function enqueueNotice(message, type) {
    var notice = { message: message, type: type || 'info' };
    if (noticeListeners.length) {
      noticeListeners.slice().forEach(function (fn) {
        try { fn(notice); } catch (err) { /* ignore */ }
      });
    } else {
      noticeQueue.push(notice);
    }
  }

  /* ------------------------------------------------------------------ */
  /*  Schema defaults & normalization                                    */
  /* ------------------------------------------------------------------ */

  function emptyCompany() {
    return {
      nameEn: '', nameCn: '', addressEn: '', addressCn: '', city: '', country: 'CHINA',
      tel: '', fax: '', email: '', website: '', taxId: '', signer: '', signerTitle: '',
      logo: '', seal: ''
    };
  }

  function emptyBank() {
    return {
      beneficiaryEn: '', bankNameEn: '', bankAddressEn: '', accountNo: '',
      swift: '', iban: '', bankCode: '', intermediary: ''
    };
  }

  function emptyDefaults() {
    return {
      currency: 'USD', incoterm: 'FOB', paymentTerms: '', portOfLoading: '',
      portOfDischarge: '', countryOfOrigin: 'CHINA', declaration: '', certStatement: '',
      bilingual: false, showSeal: true
    };
  }

  function emptyNumbering() {
    var next = {};
    DOC_KEYS.forEach(function (key) { next[key] = 1; });
    return { next: next, padding: 4 };
  }

  function defaultSettings() {
    return {
      company: emptyCompany(),
      bank: emptyBank(),
      defaults: emptyDefaults(),
      numbering: emptyNumbering(),
      ui: { lastRoute: '#/dashboard' }
    };
  }

  function normalizeSettings(raw) {
    var settings = defaultSettings();
    if (!isPlainObject(raw)) return settings;
    deepAssign(settings.company, isPlainObject(raw.company) ? raw.company : {});
    deepAssign(settings.bank, isPlainObject(raw.bank) ? raw.bank : {});
    deepAssign(settings.defaults, isPlainObject(raw.defaults) ? raw.defaults : {});
    var numbering = isPlainObject(raw.numbering) ? raw.numbering : {};
    if (isPlainObject(numbering.next)) {
      DOC_KEYS.forEach(function (key) {
        var value = Math.floor(core.num(numbering.next[key], 1));
        settings.numbering.next[key] = value > 0 ? value : 1;
      });
    }
    var padding = Math.floor(core.num(numbering.padding, 4));
    settings.numbering.padding = Math.min(8, Math.max(1, padding || 4));
    var ui = isPlainObject(raw.ui) ? raw.ui : {};
    settings.ui.lastRoute = str(ui.lastRoute) || '#/dashboard';
    settings.defaults.currency = str(settings.defaults.currency) || 'USD';
    settings.defaults.incoterm = str(settings.defaults.incoterm) || 'FOB';
    settings.defaults.countryOfOrigin = str(settings.defaults.countryOfOrigin) || 'CHINA';
    settings.defaults.bilingual = !!settings.defaults.bilingual;
    settings.defaults.showSeal = settings.defaults.showSeal !== false;
    return settings;
  }

  function normalizeBuyer(raw) {
    var buyer = {};
    BUYER_FIELDS.forEach(function (field) {
      buyer[field] = str(isPlainObject(raw) ? raw[field] : '');
    });
    return buyer;
  }

  function normalizeItem(raw) {
    if (!isPlainObject(raw)) return null;
    var item = { id: str(raw.id) || core.uid('item'), productId: str(raw.productId) };
    ITEM_STRING_FIELDS.forEach(function (field) { item[field] = str(raw[field]); });
    ITEM_NUMBER_FIELDS.forEach(function (field) { item[field] = core.num(raw[field], 0); });
    return item;
  }

  function normalizeDocMeta(raw) {
    var meta = {};
    if (!isPlainObject(raw)) return meta;
    DOC_KEYS.forEach(function (key) {
      var entry = raw[key];
      if (isPlainObject(entry) && str(entry.no)) {
        meta[key] = { no: str(entry.no), date: str(entry.date) };
      }
    });
    return meta;
  }

  function normalizePrint(raw) {
    var source = isPlainObject(raw) ? raw : {};
    var selected = Array.isArray(source.selected)
      ? source.selected.map(str).filter(function (key, index, arr) {
        return DOC_KEYS.indexOf(key) >= 0 && arr.indexOf(key) === index;
      })
      : ['ci', 'pl'];
    return {
      selected: selected,
      bilingual: !!source.bilingual,
      showSeal: source.showSeal !== false
    };
  }

  function normalizeOrder(raw) {
    if (!isPlainObject(raw)) return null;
    var order = {
      id: str(raw.id) || core.uid('ord'),
      no: str(raw.no),
      status: raw.status === 'done' ? 'done' : 'draft',
      date: core.fmtDate(raw.date, 'iso') || core.todayISO(),
      createdAt: str(raw.createdAt) || nowISO(),
      updatedAt: str(raw.updatedAt) || nowISO(),
      customerId: str(raw.customerId),
      buyer: normalizeBuyer(raw.buyer),
      consignee: str(raw.consignee),
      notifyParty: str(raw.notifyParty),
      currency: str(raw.currency) || 'USD',
      incoterm: str(raw.incoterm) || 'FOB',
      paymentTerms: str(raw.paymentTerms),
      portOfLoading: str(raw.portOfLoading),
      portOfDischarge: str(raw.portOfDischarge),
      finalDestination: str(raw.finalDestination),
      countryOfDestination: str(raw.countryOfDestination),
      transportMode: str(raw.transportMode) || 'SEA',
      vessel: str(raw.vessel),
      voyage: str(raw.voyage),
      containerNo: str(raw.containerNo),
      sealNo: str(raw.sealNo),
      blNo: str(raw.blNo),
      bookingNo: str(raw.bookingNo),
      lcNo: str(raw.lcNo),
      lcDate: core.fmtDate(raw.lcDate, 'iso') || '',
      lcIssuingBank: str(raw.lcIssuingBank),
      etd: core.fmtDate(raw.etd, 'iso') || '',
      eta: core.fmtDate(raw.eta, 'iso') || '',
      shippingMarks: str(raw.shippingMarks),
      remarks: str(raw.remarks),
      items: Array.isArray(raw.items) ? raw.items.map(normalizeItem).filter(Boolean) : [],
      charges: {},
      cost: {},
      docMeta: normalizeDocMeta(raw.docMeta),
      print: normalizePrint(raw.print)
    };
    CHARGE_FIELDS.forEach(function (field) {
      order.charges[field] = core.num(isPlainObject(raw.charges) ? raw.charges[field] : 0, 0);
    });
    COST_FIELDS.forEach(function (field) {
      var fallback = field === 'exchangeRate' ? 7.1 : 0;
      order.cost[field] = core.num(isPlainObject(raw.cost) ? raw.cost[field] : fallback, fallback);
    });
    return order;
  }

  function normalizeCustomer(raw) {
    if (!isPlainObject(raw)) return null;
    var customer = {};
    CUSTOMER_FIELDS.forEach(function (field) {
      customer[field] = str(raw[field]);
    });
    if (!customer.id) customer.id = core.uid('cust');
    return customer;
  }

  function normalizeProduct(raw) {
    if (!isPlainObject(raw)) return null;
    var product = {};
    PRODUCT_STRING_FIELDS.forEach(function (field) { product[field] = str(raw[field]); });
    if (!product.id) product.id = core.uid('prod');
    PRODUCT_NUMBER_FIELDS.forEach(function (field) { product[field] = core.num(raw[field], 0); });
    product.currency = product.currency || 'USD';
    product.origin = product.origin || 'CHINA';
    product.unit = product.unit || 'PCS';
    product.pkg = product.pkg || 'CARTON';
    return product;
  }

  function normalizeState(raw) {
    if (!isPlainObject(raw)) return null;
    if (!isPlainObject(raw.settings)) return null;
    if (!Array.isArray(raw.orders) || !Array.isArray(raw.customers) || !Array.isArray(raw.products)) return null;
    var normalized = {
      schemaVersion: SCHEMA_VERSION,
      settings: normalizeSettings(raw.settings),
      customers: raw.customers.map(normalizeCustomer).filter(Boolean),
      products: raw.products.map(normalizeProduct).filter(Boolean),
      orders: raw.orders.map(normalizeOrder).filter(Boolean),
      activeOrderId: str(raw.activeOrderId),
      meta: isPlainObject(raw.meta) ? {
        createdAt: str(raw.meta.createdAt) || nowISO(),
        updatedAt: str(raw.meta.updatedAt) || nowISO()
      } : { createdAt: nowISO(), updatedAt: nowISO() }
    };
    if (raw.meta && raw.meta.demo) normalized.meta.demo = true;
    if (!core.byId(normalized.orders, normalized.activeOrderId)) {
      normalized.activeOrderId = normalized.orders.length ? normalized.orders[0].id : '';
    }
    return normalized;
  }

  function emptyState() {
    return {
      schemaVersion: SCHEMA_VERSION,
      settings: defaultSettings(),
      customers: [],
      products: [],
      orders: [],
      activeOrderId: '',
      meta: { createdAt: nowISO(), updatedAt: nowISO() }
    };
  }

  function demoState() {
    var raw = null;
    try {
      if (TD.demo && typeof TD.demo.data === 'function') raw = TD.demo.data();
    } catch (err) {

      return JSON.stringify(state, null, 2);

    importJSON: function (text) {
      var source = str(text);
      if (!source.trim()) return { ok: false, message: '备份文件为空' };
      var parsed;
      try {
        parsed = JSON.parse(source);

      saveNow();

        ok: true,

    resetDemo: function () {
      var prev = state;

    },

    clearAll: function () {
      var prev = state;
      state = emptyState();

      saveNow();

    /** Flush any pending debounced write immediately. */
    flush: function () {

  /* ================================================================

  var TOAST_ICON = { success: 'check-circle', error: 'alert-circle', warn: 'alert', info: 'info' };
  var toastTimers = [];

  function toast(message, type, options) {
    var stack = $('#toast-stack');
    if (!stack) return;
    var kind = type || 'info';
    var opts = options || {};
    var node = document.createElement('div');
    node.className = 'toast toast--' + kind;
    node.setAttribute('data-testid', 'toast');
    node.setAttribute('role', 'status');
    node.innerHTML = '<span class="toast-icon">' + icon(TOAST_ICON[kind] || 'info', 14) + '</span>' +
      '<div class="toast-text">' + (opts.title ? '<div class="toast-title">' + esc(opts.title) + '</div>' : '') +
      '<div class="toast-message">' + esc(message) + '</div></div>';
    stack.appendChild(node);
    while (stack.children.length > 4) stack.removeChild(stack.firstChild);
    var timer = setTimeout(function () {
      node.classList.add('is-leaving');
      var removeTimer = setTimeout(function () {
        if (node.parentNode) node.parentNode.removeChild(node);
      }, 200);
      toastTimers.push(removeTimer);
    }, 3000);
    toastTimers.push(timer);
  }

  /* ================================================================
   *  Modal engine (focus trap-ish, Esc, backdrop, restore focus)
   * ================================================================ */

  var modalState = null;

  function openModal(o) {
    closeModal();
    var opts = o || {};
    var rootEl = $('#modal-root');
    if (!rootEl) return;
    var previousFocus = document.activeElement;
    rootEl.innerHTML = '<div class="modal-overlay no-print" data-modal-overlay>' +
      '<div class="modal' + (opts.size === 'sm' ? ' modal--sm' : opts.size === 'lg' ? ' modal--lg' : opts.size === 'xl' ? ' modal--xl' : '') + '" role="dialog" aria-modal="true" aria-labelledby="modal-title">' +
      '<div class="modal-head"><div><h2 class="modal-title" id="modal-title">' + esc(opts.title || '') + '</h2>' +
      (opts.subtitle ? '<div class="modal-sub">' + esc(opts.subtitle) + '</div>' : '') + '</div>' +
      '<button type="button" class="icon-btn icon-btn--sm icon-btn--plain modal-x" data-action="close-modal" aria-label="关闭弹窗">' + icon('x', 16) + '</button></div>' +
      '<div class="modal-body">' + (opts.body || '') + '</div>' +
      (opts.footer ? '<div class="modal-foot">' + opts.footer + '</div>' : '') +
      '</div></div>';

    modalState = {
      onClose: opts.onClose || null,
      onConfirm: opts.onConfirm || null,
      previousFocus: previousFocus,
      closed: false
    };

    var overlay = rootEl.querySelector('[data-modal-overlay]');
    if (overlay) {
      overlay.addEventListener('mousedown', function (e) {
        if (e.target === overlay && !opts.static) closeModal(false);
      });
    }
    document.addEventListener('keydown', onModalKeydown, true);
    if (typeof opts.onMount === 'function') {
      try { opts.onMount(rootEl); } catch (err) { console.error('[TradeDocs] modal mount failed', err); }
    }
    var focusTarget = rootEl.querySelector('[data-autofocus]') ||
      rootEl.querySelector('.modal-body input:not([type="hidden"]), .modal-body select, .modal-body textarea') ||
      rootEl.querySelector('.modal-foot .btn--primary, .modal-foot .btn');
    if (focusTarget) {
      setTimeout(function () { try { focusTarget.focus(); } catch (err) { /* ignore */ } }, 20);
    }
  }

  function closeModal(confirmed) {
    if (!modalState) return;
    var stateRef = modalState;
    modalState = null;
    document.removeEventListener('keydown', onModalKeydown, true);
    var rootEl = $('#modal-root');
    if (rootEl) rootEl.innerHTML = '';
    if (stateRef.previousFocus && stateRef.previousFocus.focus) {
      try { stateRef.previousFocus.focus(); } catch (err) { /* ignore */ }
    }
    if (!stateRef.closed) {
      stateRef.closed = true;
      if (typeof stateRef.onClose === 'function') {
        try { stateRef.onClose(!!confirmed); } catch (err) { console.error(err); }
      }
    }
  }

  function onModalKeydown(e) {
    if (!modalState) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      closeModal(false);
      return;
    }
    if (e.key === 'Tab') {
      var rootEl = $('#modal-root');
      if (!rootEl) return;
      var focusables = $$('button, [href], input:not([type="hidden"]), select, textarea, [tabindex]:not([tabindex="-1"])', rootEl)
        .filter(function (el) { return !el.disabled && el.offsetParent !== null; });
      if (!focusables.length) return;
      var first = focusables[0];
      var last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  }

  function confirmDialog(o) {
    var opts = o || {};
    return new Promise(function (resolve) {
      openModal({

          (opts.warning ? '<div class="alert alert--danger confirm-warning">' + icon('alert', 16) + '<span>' + esc(opts.warning) + '</span></div>' : ''),
        footer: '<button type="button" class="btn" data-action="modal-cancel">' + esc(opts.cancelText || '取消') + '</button>' +
          '<button type="button" class="btn ' + (opts.danger ? 'btn--danger-solid' : 'btn--primary') + '" data-action="modal-confirm" data-autofocus>' + esc(opts.confirmText || '确认') + '</button>',
        onConfirm: function () { resolve(true); },
        onClose: function (confirmed) { if (!confirmed) resolve(false); }

  /* ================================================================
   *  Router
   * ================================================================ */

  var currentRoute = { name: 'dashboard', id: '', docKey: '' };
  var knownRoutes = ['dashboard', 'orders', 'preview', 'customers', 'products', 'settings', 'help'];

  function safeDecode(value) {
    try { return decodeURIComponent(value); } catch (err) { return value; }
  }

  function parseRoute() {
    var raw = String(location.hash || '').replace(/^#\/?/, '');
    var parts = raw.split('/').filter(function (part) { return part !== ''; }).map(safeDecode);
    var name = parts[0] || 'dashboard';
    if (knownRoutes.indexOf(name) < 0) name = 'dashboard';
    var route = { name: name, id: '', docKey: '' };
    if (name === 'orders') route.id = parts[1] || '';
    if (name === 'preview') { route.id = parts[1] || ''; route.docKey = parts[2] || ''; }
    return route;
  }

  function normalizePath(path) {
    var value = String(path || '');
    if (value.charAt(0) === '#') value = value.slice(1);
    if (value.charAt(0) !== '/') value = '/' + value;
    return '#' + value;
  }

  function navigate(path) {
    var target = normalizePath(path);
    flushPendingEditors();
    if (location.hash === target) {
      renderRoute();
    } else {
      location.hash = target;
    }
  }

  function refreshPage() {
    flushPendingEditors();
    renderRoute();
  }

  function renderRoute() {
    var parsed = parseRoute();
    currentRoute = parsed;
    var inner = $('#view-inner');
    var view = $('#view');
    if (!inner) return;
    var result;
    try {
      if (parsed.name === 'orders') result = parsed.id ? editorPage(parsed.id) : ordersPage();
      else if (parsed.name === 'preview') result = previewPage(parsed.id, parsed.docKey);
      else if (parsed.name === 'customers') result = customersPage();
      else if (parsed.name === 'products') result = productsPage();
      else if (parsed.name === 'settings') result = settingsPage();
      else if (parsed.name === 'help') result = helpPage();
      else result = dashboardPage();
    } catch (err) {
      console.error('[TradeDocs] 页面渲染失败', err);
      result = {

    if (typeof result.mount === 'function') {

  function bindPaths(scope, draft, onInput) {
    if (!scope) return;
    scope.addEventListener('input', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute) return;
      var path = el.getAttribute('data-path');
      if (!path) return;
      var value = readControl(el);
      setPath(draft, path, value);
      if (typeof onInput === 'function') onInput(path, el, value);
    });
  }

  function syncFormToDraft(scope, draft) {
    if (!scope || !draft) return;
    $$('[data-path]', scope).forEach(function (el) {
      var path = el.getAttribute('data-path');
      if (!path) return;
      setPath(draft, path, readControl(el));
    });
  }

  function syncItemInputs(scope, draft) {
    if (!scope || !draft || !Array.isArray(draft.items)) return;
    $$('[data-item-field]', scope).forEach(function (el) {
      var index = Number(el.getAttribute('data-item-index'));
      var field = el.getAttribute('data-item-field');
      var item = draft.items[index];
      if (!item || !field) return;
      item[field] = readControl(el);

      row.hidden = !show;

    var count = $('#orders-count');

  function computeCompleteness(order) {
    var calc = calcSafely(order);
    var buyer = order.buyer || {};
    var items = Array.isArray(order.items) ? order.items : [];
    var settings = store.getState().settings || {};
    var company = settings.company || {};
    var checks = [
      { ok: !!(String(buyer.nameEn || '').trim() || String(buyer.nameCn || '').trim()), label: '买方名称' },
      { ok: !!String(buyer.addressEn || '').trim(), label: '买方地址' },
      { ok: !!core.parseISO(order.date), label: '订单日期' },
      { ok: items.length > 0, label: '货物明细' },
      { ok: items.length > 0 && items.every(function (it) { return !!String(it.nameEn || it.nameCn || '').trim(); }), label: '货物名称' },
      { ok: items.length > 0 && items.every(function (it) { return core.num(it.qty, 0) > 0; }), label: '货物数量' },
      { ok: calc.grandTotal > 0, label: '单价与金额' },
      { ok: items.length > 0 && items.every(function (it) { return core.num(it.cartons, 0) > 0 || core.num(it.qtyPerCarton, 0) > 0; }), label: '箱数 / 箱规' },
      { ok: items.length > 0 && items.every(function (it) { return core.num(it.grossWeight, 0) > 0; }), label: '每箱毛重' },
      { ok: !!(String(order.portOfLoading || '').trim() && String(order.portOfDischarge || '').trim()), label: '起运港 / 目的港' },
      { ok: !!String(order.incoterm || '').trim(), label: '贸易术语' },
      { ok: !!String(order.paymentTerms || '').trim(), label: '付款方式' },
      { ok: !!(String(order.countryOfDestination || '').trim() || String(buyer.country || '').trim()), label: '目的国' },
      { ok: !!String(company.nameEn || company.nameCn || '').trim(), label: '公司抬头' }
    ];
    var okCount = 0;
    var missing = [];
    checks.forEach(function (check) {
      if (check.ok) okCount += 1;
      else missing.push(check.label);
    });
    return { pct: Math.round((okCount / checks.length) * 100), missing: missing, total: checks.length, okCount: okCount };
  }

  function setText(selector, value) {
    var el = $(selector);
    if (el) el.textContent = value;
  }

  function refreshEditorComputed() {
    if (!activeEditor) return;
    var order = activeEditor.draft;
    var calc = calcSafely(order);
    $$('#order-form tr[data-item-index]').forEach(function (tr) {
      var index = Number(tr.getAttribute('data-item-index'));
      var line = calc.lines[index];

      if (line && amountEl) amountEl.textContent = money(line.amount, order.currency);

    });

    setText('[data-total-amount]', money(calc.merchandiseTotal, order.currency));
    setText('[data-total-cartons]', qtyText(calc.totalCartons));
    setText('[data-total-net]', numText(calc.totalNetWeight, 3) + ' kg');
    setText('[data-total-gross]', numText(calc.totalGrossWeight, 3) + ' kg');
    setText('[data-total-cbm]', numText(calc.totalCbm, 3) + ' m³');
    setText('[data-charges-merchandise]', money(calc.merchandiseTotal, order.currency));
    setText('[data-charges-total]', money(calc.grandTotal, order.currency));
    updateEditorSummary();

  function scheduleEditorSave() {
    if (!activeEditor) return;
    activeEditor.dirty = true;
    if (activeEditor.timer) clearTimeout(activeEditor.timer);
    activeEditor.timer = setTimeout(function () {
      if (!activeEditor) return;
      activeEditor.timer = null;
      commitEditor({ silent: true });
    }, 500);
  }

  function syncDocMetaFromDom(form, draft) {
    if (!form || !draft) return;
    var viewed = 0;
    $$('[data-doc-meta]', form).forEach(function (el) {
      var key = el.getAttribute('data-doc-meta');
      if (!key) return;
      viewed += 1;
      draft.docMeta = draft.docMeta || {};
      draft.docMeta[key] = draft.docMeta[key] || { no: '', date: draft.date || core.todayISO() };
      draft.docMeta[key].no = String(el.value || '').trim();
    });
    $$('[data-doc-meta-date]', form).forEach(function (el) {
      var key = el.getAttribute('data-doc-meta-date');
      if (!key) return;
      draft.docMeta = draft.docMeta || {};
      draft.docMeta[key] = draft.docMeta[key] || { no: '' };
      draft.docMeta[key].date = el.value || draft.date || core.todayISO();
    });
    if (viewed) {
      var checked = $$('[data-doc-select]', form).filter(function (el) { return el.checked; })
        .map(function (el) { return el.getAttribute('data-doc-select'); });
      draft.print = draft.print || {};
      draft.print.selected = docKeys().filter(function (key) { return checked.indexOf(key) >= 0; });
    }
    Object.keys(draft.docMeta || {}).forEach(function (key) {
      var meta = draft.docMeta[key];
      if (!meta || (!meta.no && !meta.date)) delete draft.docMeta[key];
    });
  }

  function commitEditor(opts) {
    if (!activeEditor) return null;
    var form = $('#order-form');
    if (form) {
      syncFormToDraft(form, activeEditor.draft);
      syncItemInputs(form, activeEditor.draft);
      syncDocMetaFromDom(form, activeEditor.draft);
    }
    var saved = store.saveOrder(activeEditor.draft);
    if (saved) {
      activeEditor.draft = saved;
      activeEditor.dirty = false;
      updateEditorUpdatedLabel();
    }
    if (!(opts && opts.silent)) refreshEditorComputed();
    return saved;
  }

  function saveEditorExplicit() {
    if (!activeEditor) {
      toast('当前页面没有正在编辑的订单', 'warn');
      return;
    }
    var saved = commitEditor({ silent: true });
    if (!saved) {
      toast('保存失败，请检查浏览器存储权限或空间', 'error');
      return;
    }
    refreshEditorComputed();
    var issues;
    try { issues = core.validateOrder(saved); } catch (err) { issues = []; }
    var errors = issues.filter(function (issue) { return issue.level === 'error'; }).length;
    var warns = issues.length - errors;
    if (errors) toast('订单已保存，但仍有 ' + errors + ' 项必填内容待完善', 'warn', { title: '已保存草稿' });
    else if (warns) toast('订单已保存，有 ' + warns + ' 项信息建议补充', 'success', { title: '已保存' });
    else toast('订单已保存，资料完整', 'success', { title: '已保存' });
  }

  function previewEditorAction() {
    if (!activeEditor) return;
    var form = $('#order-form');
    if (form) {
      syncFormToDraft(form, activeEditor.draft);
      syncItemInputs(form, activeEditor.draft);
      syncDocMetaFromDom(form, activeEditor.draft);
    }
    commitEditor({ silent: true });
    var id = activeEditor.orderId;
    navigate('#/preview/' + encodeURIComponent(id));
  }

  function flushEditorDraft() {
    var editor = activeEditor;
    if (!editor) return;
    activeEditor = null;
    if (editor.timer) {
      clearTimeout(editor.timer);
      editor.timer = null;
    }
    if (editor.dirty) {
      try { store.saveOrder(editor.draft); } catch (err) { console.error('[TradeDocs] 离开编辑器时保存失败', err); }
    }
  }

  function rerenderItems() {
    if (!activeEditor) return;
    var area = $('#items-area');
    if (!area) return;
    area.innerHTML = itemsAreaHTML(activeEditor.draft);
    refreshEditorComputed();
    scheduleEditorSave();
  }

  function addProductFromPicker() {
    if (!activeEditor) return;
    var picker = $('#product-picker');
    var productId = picker ? picker.value : '';
    var product = productId ? store.getProduct(productId) : null;
    if (!product) {
      toast('请先在产品库中维护产品，或使用「自定义行」手工录入', 'warn');
      return;
    }
    var item = {
      id: core.uid('item'),
      productId: product.id,
      code: product.code || '',
      nameEn: product.nameEn || '',
      nameCn: product.nameCn || '',
      hsCode: product.hsCode || '',
      origin: product.origin || 'CHINA',
      unit: product.unit || 'PCS',
      qty: core.num(product.qtyPerCarton, 0) > 0 ? core.num(product.qtyPerCarton, 0) : 0,
      unitPrice: core.num(product.price, 0),
      cartons: core.num(product.qtyPerCarton, 0) > 0 ? 1 : 0,
      qtyPerCarton: core.num(product.qtyPerCarton, 0),
      netWeight: core.num(product.netWeight, 0),
      grossWeight: core.num(product.grossWeight, 0),
      cbm: core.num(product.cbm, 0),
      costPrice: 0,
      remarks: ''
    };

    rerenderItems();
    toast('已添加「' + (product.nameCn || product.nameEn) + '」', 'success');
    var rows = $$('#items-area tr[data-item-index]');
    if (rows.length) {
      var last = rows[rows.length - 1];
      if (last.scrollIntoView) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      var qtyInput = last.querySelector('[data-item-field="qty"]');
      if (qtyInput) qtyInput.focus();
    }

  function addBlankItem() {
    if (!activeEditor) return;
    activeEditor.draft.items.push({
      id: core.uid('item'), productId: '', code: '', nameEn: '', nameCn: '', hsCode: '',
      origin: 'CHINA', unit: 'PCS', qty: 0, unitPrice: 0, cartons: 0, qtyPerCarton: 0,
      netWeight: 0, grossWeight: 0, cbm: 0, costPrice: 0, remarks: ''
    });
    rerenderItems();
    var rows = $$('#items-area tr[data-item-index]');
    if (rows.length) {
      var last = rows[rows.length - 1];
      if (last.scrollIntoView) last.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      var nameInput = last.querySelector('[data-item-field="nameEn"]');
      if (nameInput) nameInput.focus();
    }
  }

  function duplicateItem(index) {
    if (!activeEditor || !activeEditor.draft.items[index]) return;
    var clone = core.clone(activeEditor.draft.items[index]);
    clone.id = core.uid('item');
    activeEditor.draft.items.splice(index + 1, 0, clone);
    rerenderItems();
  }

  function deleteItem(index) {
    if (!activeEditor || !activeEditor.draft.items[index]) return;
    activeEditor.draft.items.splice(index, 1);
    rerenderItems();
    toast('已删除货物行', 'info');
  }

  function applyCustomerSnapshot(customerId) {
    if (!activeEditor) return;
    var customer = customerId ? store.getCustomer(customerId) : null;
    if (!customer) {
      activeEditor.draft.customerId = '';
      scheduleEditorSave();
      return;
    }
    var buyer = {};
    ['nameEn', 'nameCn', 'addressEn', 'addressCn', 'country', 'contact', 'tel', 'email', 'taxId'].forEach(function (key) {
      buyer[key] = customer[key] || '';
    });
    activeEditor.draft.customerId = customer.id;
    activeEditor.draft.buyer = buyer;
    Object.keys(buyer).forEach(function (key) {
      var input = $('[data-path="buyer.' + key + '"]');
      if (input) input.value = buyer[key];
    });
    var select = $('#customer-select');
    if (select) select.value = customer.id;
    scheduleEditorSave();
    updateEditorSummary();
    toast('已填入客户快照：' + (customer.nameCn || customer.nameEn), 'success');
  }

  function refreshCustomerSelect(selectedId) {
    var select = $('#customer-select');
    if (!select) return;
    var customers = store.getState().customers || [];
    select.innerHTML = '<option value="">— 从客户库选择买方（快照） —</option>' + customers.map(function (customer) {
      return '<option value="' + esc(customer.id) + '">' + esc((customer.code ? customer.code + ' · ' : '') + (customer.nameCn || customer.nameEn || '未命名客户')) + '</option>';
    }).join('');
    select.value = selectedId || '';
  }

  function saveBuyerAsCustomer() {
    if (!activeEditor) return;
    var buyer = activeEditor.draft.buyer || {};
    if (!String(buyer.nameEn || buyer.nameCn || '').trim()) {
      toast('请先填写买方名称，再存入客户库', 'warn');
      return;
    }
    var customer = store.saveCustomer({
      nameEn: buyer.nameEn, nameCn: buyer.nameCn, addressEn: buyer.addressEn, addressCn: buyer.addressCn,
      country: buyer.country, contact: buyer.contact, tel: buyer.tel, email: buyer.email, taxId: buyer.taxId
    });
    if (!customer) {
      toast('存入客户库失败', 'error');
      return;
    }
    activeEditor.draft.customerId = customer.id;
    refreshCustomerSelect(customer.id);
    scheduleEditorSave();
    toast('已将买方信息存入客户库', 'success');
  }

  function toggleDocSelection(key, on) {
    if (!activeEditor || !key) return;
    var order = activeEditor.draft;
    var set = {};
    (order.print.selected || []).forEach(function (k) { set[k] = true; });
    if (on) set[key] = true;
    else delete set[key];
    order.print.selected = docKeys().filter(function (k) { return set[k]; });
    var row = $('[data-doc-row="' + key + '"]');
    if (row) row.classList.toggle('is-on', !!on);
    scheduleEditorSave();
    updateEditorSummary();
  }

  function regenerateDocMeta(key) {
    if (!activeEditor || !key) return;
    var meta;
    try {
      meta = store.regenerateDocMeta(activeEditor.draft, key);
    } catch (err) {
      toast('重新生成编号失败', 'error');
      return;
    }
    activeEditor.draft.docMeta = activeEditor.draft.docMeta || {};
    activeEditor.draft.docMeta[key] = meta;
    var input = $('[data-doc-meta="' + key + '"]');
    if (input) input.value = meta.no;
    var dateInput = $('[data-doc-meta-date="' + key + '"]');
    if (dateInput && !dateInput.value) dateInput.value = meta.date;
    scheduleEditorSave();
    toast('已重新生成编号 ' + meta.no, 'success');
  }

  function updateEditorStatusUI() {
    if (!activeEditor) return;
    var badgeHost = $('#editor-status-badge');
    if (badgeHost) badgeHost.outerHTML = statusBadge(activeEditor.draft.status);
  }

  function mountEditorPage() {
    if (!activeEditor) return;
    var form = $('#order-form');
    if (!form) return;
    bindPaths(form, activeEditor.draft, function (path) {
      if (path === 'status') updateEditorStatusUI();
      scheduleEditorSave();
      refreshEditorComputed();
    });
    form.addEventListener('input', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute) return;
      var index = el.getAttribute('data-item-index');
      var itemField = el.getAttribute('data-item-field');
      if (index !== null && itemField) {
        var item = activeEditor.draft.items[Number(index)];
        if (!item) return;
        item[itemField] = readControl(el);
        scheduleEditorSave();
        refreshEditorComputed();
        return;
      }
      var docKey = el.getAttribute('data-doc-meta');
      var docDateKey = el.getAttribute('data-doc-meta-date');
      if (docKey) {
        var order = activeEditor.draft;
        order.docMeta = order.docMeta || {};
        order.docMeta[docKey] = order.docMeta[docKey] || { date: order.date || core.todayISO() };
        order.docMeta[docKey].no = String(el.value || '').trim();
        scheduleEditorSave();
      } else if (docDateKey) {
        var orderRef = activeEditor.draft;
        orderRef.docMeta = orderRef.docMeta || {};
        orderRef.docMeta[docDateKey] = orderRef.docMeta[docDateKey] || { no: '' };
        orderRef.docMeta[docDateKey].date = el.value || '';
        scheduleEditorSave();
      }
    });
    form.addEventListener('change', function (e) {
      var el = e.target;
      if (!el || !el.getAttribute) return;
      var docSelect = el.getAttribute('data-doc-select');
      if (docSelect) toggleDocSelection(docSelect, !!el.checked);
      if (el.id === 'customer-select') applyCustomerSnapshot(el.value);
    });
    updateEditorSummary();
    refreshEditorComputed();
  }

  var previewState = null;

  function sanitizeSelected(selected) {
    var keys = docKeys();
    var set = {};
    (Array.isArray(selected) ? selected : []).forEach(function (key) {
      if (keys.indexOf(key) >= 0) set[key] = true;
    });
    return keys.filter(function (key) { return set[key]; });
  }

  function previewPage(orderId, docKey) {
    if (!orderId) return missingOrderPage('未指定订单', '预览链接中缺少订单 ID，请从订单列表重新打开。');
    var order = store.getOrder(orderId);
    if (!order) return missingOrderPage('未找到订单');
    var selected = sanitizeSelected(order.print && order.print.selected);
    if (docKey && docKeys().indexOf(docKey) >= 0 && selected.indexOf(docKey) < 0) {
      selected = sanitizeSelected(selected.concat([docKey]));
      order.print = order.print || {};
      order.print.selected = selected.slice();
      store.saveOrder(order);
      order = store.getOrder(orderId);
    }
    previewState = { orderId: order.id, selected: selected.slice(), docKey: docKey || '' };
    var sheets = buildSheets(order, selected);
    var html = previewToolbarHTML(order, selected) +
      '<div class="preview-canvas"><div id="preview-sheets" class="preview-sheets print-area">' + sheets + '</div></div>';
    return {
      html: html,
      title: '单证预览',
      crumbs: '工作台 / 订单管理 / 单证预览',
      nav: 'orders',
      mount: mountPreviewPage,
      afterRender: function () { if (docKey) scrollToPreviewDoc(docKey); }
    };
  }

  function buildSheets(order, selected) {
    if (!selected.length) return previewEmptyHTML();
    if (!hasDocsEngine()) return previewFallbackHTML(order, selected);
    var out = '';
    selected.forEach(function (key) {
      var meta;
      try {
        meta = store.ensureDocMeta(order, key);
      } catch (err) {
        console.error('[TradeDocs] 单证编号生成失败：' + key, err);
        meta = { no: '', date: order.date || core.todayISO() };
      }
      try {
        var rendered = TD.docs.render(key, {
          state: store.getState(),
          order: order,
          meta: { no: String(meta.no || ''), date: String(meta.date || order.date || '') },
          opts: {
            bilingual: !!(order.print && order.print.bilingual),
            showSeal: !order.print || order.print.showSeal !== false,
            showSignature: true
          },
          core: core
        });
        if (typeof rendered !== 'string' || !rendered.trim()) throw new Error('单证渲染返回空内容');
        out += '<div class="preview-sheet" data-preview-doc="' + esc(key) + '">' + rendered + '</div>';
      } catch (err) {
        console.error('[TradeDocs] 单证渲染失败：' + key, err);
        out += docErrorHTML(key, err);
      }
    });
    return out;
  }

  function mountPreviewPage() {
    var toolbar = $('.preview-toolbar');
    if (toolbar) {
      toolbar.addEventListener('change', function (e) {
        var el = e.target;
        if (!el || !el.getAttribute) return;
        var toggle = el.getAttribute('data-preview-toggle');
        if (!toggle) return;
        updatePreviewToggle(toggle, !!el.checked);
      });
    }
  }

  function updatePreviewToggle(toggle, value) {
    if (!previewState) return;
    var order = store.getOrder(previewState.orderId);
    if (!order) return;
    order.print = order.print || {};
    order.print.selected = previewState.selected.slice();
    order.print[toggle] = value;
    store.saveOrder(order);
    refreshPreviewSheets();
  }

  function persistPreviewPrint() {
    if (!previewState) return;
    var order = store.getOrder(previewState.orderId);
    if (!order) return;
    order.print = order.print || {};
    order.print.selected = previewState.selected.slice();
    store.saveOrder(order);
  }

  function refreshPreviewSheets() {
    if (!previewState) return;
    var order = store.getOrder(previewState.orderId);
    var container = $('#preview-sheets');
    if (!order || !container) return;
    container.innerHTML = buildSheets(order, previewState.selected);
    syncPreviewChips();
  }

  function syncPreviewChips() {
    if (!previewState) return;
    $$('.doc-tab[data-doc-tab]').forEach(function (el) {
      var on = previewState.selected.indexOf(el.getAttribute('data-doc-tab')) >= 0;
      el.classList.toggle('is-active', on);
      el.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    $$('[data-preview-count]').forEach(function (el) {
      el.textContent = previewState.selected.length;
    });
  }

  function previewAddDoc(key) {
    if (!previewState || !key) return;
    if (previewState.selected.indexOf(key) < 0) {
      previewState.selected = sanitizeSelected(previewState.selected.concat([key]));
      persistPreviewPrint();
      refreshPreviewSheets();
    }
    scrollToPreviewDoc(key);
  }

  function previewRemoveDoc(key) {
    if (!previewState || !key) return;
    var next = previewState.selected.filter(function (k) { return k !== key; });
    if (next.length === previewState.selected.length) return;
    previewState.selected = next;
    persistPreviewPrint();
    refreshPreviewSheets();
  }

  function previewSelectAll() {
    if (!previewState) return;
    previewState.selected = docKeys();
    persistPreviewPrint();
    refreshPreviewSheets();
    toast('已选择全部 ' + previewState.selected.length + ' 类单证', 'info');
  }

  function previewClear() {
    if (!previewState) return;
    previewState.selected = [];
    persistPreviewPrint();
    refreshPreviewSheets();
  }

  function scrollToPreviewDoc(key) {
    if (!key) return;
    setTimeout(function () {
      var target = $('[data-preview-doc="' + key + '"]');
      if (!target || !target.getBoundingClientRect) return;
      var toolbar = $('.preview-toolbar');
      var offset = (toolbar ? toolbar.getBoundingClientRect().height : 0) + 96;
      var top = target.getBoundingClientRect().top + window.scrollY - offset;
      window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
    }, 80);
  }

  function doPrint() {
    if (!previewState) return;
    if (!previewState.selected.length) {
      toast('请先在工具栏选择要打印的单证', 'warn');
      return;
    }
    if (!hasDocsEngine()) {
      toast('单证引擎尚未加载，暂时无法打印；订单数据已保存', 'error');
      return;
    }
    refreshPreviewSheets();
    setTimeout(function () {
      try {
        window.print();
      } catch (err) {
        toast('无法调用浏览器打印：' + (err && err.message ? err.message : '未知错误'), 'error');
      }
    }, 120);
  }

  function filterLibraryRows(tbodySel, emptySel, countSel, query) {
    var tbody = $(tbodySel);
    if (!tbody) return;
    var rows = $$('tr[data-search]', tbody);
    var visible = 0;
    rows.forEach(function (row) {
      var show = !query || String(row.getAttribute('data-search') || '').indexOf(query) >= 0;
      row.hidden = !show;
      if (show) visible += 1;
    });
    var empty = $(emptySel);
    if (empty) empty.hidden = visible > 0;
    var count = $(countSel);
    if (count) count.textContent = visible;
  }

  function saveProductFromModal(el) {
    var form = $('#product-form');
    if (!form) return;
    var data = { id: (el && el.getAttribute('data-id')) || '' };
    $$('[name]', form).forEach(function (input) {
      var name = input.name;
      var numeric = ['price', 'qtyPerCarton', 'netWeight', 'grossWeight', 'cbm'].indexOf(name) >= 0;
      data[name] = numeric ? core.num(input.value, 0) : input.value;
    });
    if (!String(data.nameEn || data.nameCn || '').trim()) {
      toast('请填写产品名称（英文或中文）', 'warn');
      var target = $('[name="nameEn"]', form);
      if (target) target.focus();
      return;
    }
    var saved = store.saveProduct(data);
    if (!saved) {
      toast('产品保存失败', 'error');
      return;
    }
    closeModal();
    toast('产品已保存：' + (saved.nameCn || saved.nameEn), 'success');
    refreshPage();
  }

    var product = store.getProduct(id);
    if (!product) return;
    var ok = await confirmDialog({
      title: '删除产品',
      message: '确定删除产品「' + (product.nameCn || product.nameEn) + '」吗？历史订单中的货物明细不会受影响。',
      warning: '删除后无法恢复，建议先导出 JSON 备份。',
      confirmText: '删除产品',

    });
