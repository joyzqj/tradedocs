/* ================================================================== */
/*  21. Screen preview                                                 */
/* ================================================================== */

@media screen {
  .doc-sheet {
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 14px 40px rgba(16, 24, 40, 0.18);
    border-radius: 1px;
  }

  .doc-sheet--multi .doc-page {
    box-shadow: none;
  }

  /* visible page separation for multi-page documents on screen */
  .doc-sheet--multi .doc-page + .doc-page {
    border-top: 1px dashed #b9c2cf;
  }

  .doc-sheet--multi {
    box-shadow: 0 1px 2px rgba(16, 24, 40, 0.08), 0 14px 40px rgba(16, 24, 40, 0.18);
  }
}

/* ================================================================== */
/*  22. Print rules                                                    */
/* ================================================================== */

@media print {
  html,
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: auto !important;
    background: #ffffff !important;
  }

  body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* hide application chrome (CONTRACT §6.3) */
  .app-shell,
  .preview-toolbar,
  .toast,
  .toast-stack,
  .modal,
  .modal-root,
  #modal-root,
  .sidebar-backdrop,
  .no-print {
    display: none !important;
  }

  /* fallback: print only the document container */
  body > *:not(.print-area):not(:has(.print-area)) {
    display: none !important;
  }

  /* the app view wrapper must not constrain the sheets in print */
  #view,
  main.view,
  .view-inner,
  .preview-canvas {
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    width: auto !important;
    max-width: none !important;
    background: #ffffff !important;
    box-shadow: none !important;
    border: 0 !important;
  }

  .print-area {
    display: block !important;
    margin: 0 !important;
    padding: 0 !important;
    width: 210mm !important;
    max-width: none !important;
    background: #ffffff !important;
  }

  .print-area > * {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    border: 0 !important;
  }

  .preview-sheet {
    margin: 0 !important;
    padding: 0 !important;
    background: transparent !important;
    box-shadow: none !important;
    border: 0 !important;
    width: auto !important;
    max-width: none !important;
  }

  .doc-sheet {
    width: 210mm !important;
    min-height: 0 !important;
    margin: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    background: #ffffff !important;
    overflow: visible !important;
    break-after: page;
    page-break-after: always;
  }

  .doc-page {
    width: 210mm !important;
    min-height: 295mm !important;
    padding: 11mm 14mm 9mm !important;
    box-shadow: none !important;
    border-top: 0 !important;
    break-after: page;
    page-break-after: always;
  }

  .doc-page:last-child {
    break-after: auto;
    page-break-after: auto;
  }

  .doc-sheet:last-child,
  .print-area .doc-sheet:last-of-type,
  .print-area > :last-child .doc-sheet:last-child {
    break-after: auto;
    page-break-after: auto;
  }

  /* wrapper divs used by the preview app: break between documents */
  .print-area > .preview-sheet {
    break-after: page;
    page-break-after: always;
  }

  .print-area > .preview-sheet:last-child {
    break-after: auto;
    page-break-after: auto;
  }

  /* repeat table headers on every printed page */
  thead {
    display: table-header-group;
  }

  tfoot {
    display: table-row-group;
  }

  tr,
  .doc-party,
  .doc-meta-item,
  .doc-field,
  .doc-stat,
  .doc-summary,
  .doc-bank,
  .doc-signatures,
  .doc-stamp,
  .doc-clause,
  img {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .doc-sheet,
  .doc-sheet * {
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }
}

/* ================================================================== */

/* ---- design tokens: monochrome, warm hairlines, graphite accents --- */

.doc-letterhead-names {

.doc-company-name {

  font-size: 13pt;

  text-indent: 0.1em;

  text-indent: 0.05em;

}

.doc-company-name-en {
  margin-top: 0.5mm;

  font-size: 8.3pt;
  font-weight: 600;
  line-height: 1.3;
  letter-spacing: 0.07em;
  text-transform: uppercase;

.doc-company-addr {
  margin-top: 1mm;

/* refined double hairline closing the letterhead */
.doc-letterhead-rule {

/* ---- title block: Songti serif, tracked, short double accent rule -- */

  text-indent: 0.16em;

}

.doc-title--zh {

}

}

.doc-title-block::after {

  border-bottom: 0.35pt solid var(--doc-line);
}

/* ---- meta / detail grids: airier cells, warm hairlines ------------- */
.doc-meta-grid,

}

}

}

.doc-meta-value {
  margin-top: 0.55mm;
  font-size: 8.3pt;
  line-height: 1.34;
  color: var(--doc-ink);
}

.doc-field {
  min-height: 7.6mm;
  padding: 0.9mm 1.9mm 1mm;
}

.doc-field-value {
  margin-top: 0.5mm;
  font-size: 8.2pt;
  line-height: 1.36;
  color: var(--doc-ink);
}

/* ---- party cards --------------------------------------------------- */
.doc-parties {
  gap: 2.4mm;

}

.doc-party-title {

  color: var(--doc-navy);
}

.doc-party-name {
  font-size: 8.8pt;
  font-weight: 700;
  line-height: 1.36;
}

.doc-party-name-cn {
  font-size: 8.2pt;
  line-height: 1.4;
}

.doc-party-line {
  margin-top: 0.4mm;
  font-size: 7.2pt;
  line-height: 1.4;
  color: var(--doc-ink-soft);
}

.doc-party-text {
  font-size: 8.4pt;
  line-height: 1.4;
}

/* ---- section headings: quiet left accent + hairline ---------------- */
.doc-section-title {

  border-bottom: 0.5pt solid var(--doc-line);

  color: var(--doc-navy);
}

.doc-block-title {

  font-size: 6.5pt;

/* ---- tables: warm light header, hairline grid, calmer borders ------ */
.doc-table {
  margin-bottom: 2.5mm;
  font-size: 8.1pt;
}

.doc-table th,

.doc-table tbody td {
  font-size: 8.1pt;

.doc-table tfoot td,

}

.doc-item-name {

  line-height: 1.34;
  color: var(--doc-ink);
}

.doc-item-code,
.doc-item-spec {
  font-size: 6.6pt;
  color: var(--doc-muted);
}

/* totals: clearly emphasized, double graphite rule */
.doc-table--totals th {
  padding: 0.8mm 2mm 0.8mm 0;
  border-bottom: 0.4pt dotted var(--doc-line);
  background: transparent;
  font-size: 6.9pt;
  letter-spacing: 0.05em;
  color: var(--doc-muted);
}

.doc-table--totals td {
  padding: 0.8mm 0;
  border-bottom: 0.4pt dotted var(--doc-line);
  font-size: 8.3pt;
  color: var(--doc-ink);

.doc-table--totals .doc-totals-strong th,
.doc-table--totals .doc-totals-strong td {
  padding-top: 1.2mm;

.doc-marks,
.doc-note,
.doc-remarks,
.doc-docs,
.doc-declaration,

  border: 0.5pt solid var(--doc-line);

.doc-marks-body,

}

.doc-bank {
  margin-bottom: 2.5mm;
}

  font-size: 7.4pt;
  line-height: 1.4;
}

}

.doc-bank-value {
  font-size: 7.9pt;
  font-weight: 600;
  color: var(--doc-ink);
}

/* ---- summary: emphasized words block + totals ---------------------- */
.doc-summary {
  gap: 2.8mm;
  margin-bottom: 2.5mm;
}

.doc-summary-words {

  line-height: 1.42;
  letter-spacing: 0.01em;
  color: var(--doc-navy);
}

.doc-amount-words-cn {
  margin-top: 0.5mm;
  font-size: 8pt;
  line-height: 1.5;
}

.doc-summary-totals {
  padding: 1.2mm 2mm;
  border: 0.5pt solid var(--doc-line);

.doc-sign-caption {
  font-size: 6.5pt;

.doc-sign-name {

.doc-sign-line {

.doc-sign-date-line {
  font-size: 6.8pt;

}

.doc-stamp-caption {
  font-size: 6.2pt;

}

.doc-stamp-slot {

/* ---- footer: balanced hairline row --------------------------------- */
.doc-footer {
  padding-top: 1.4mm;
  border-top: 0.5pt solid var(--doc-line);
  font-size: 6.8pt;
  letter-spacing: 0.03em;
  color: var(--doc-muted);
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: baseline;
  gap: 3mm;
}

.doc-footer-company {

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  text-align: left;
}

.doc-footer-doc {

  text-transform: uppercase;
  letter-spacing: 0.1em;

  function byId(list, id) {

  /* ------------------------------------------------------------------ */

  function fmtNum(value, dp) {

  function fmtQty(value) {

  }

  function fmtSigned(value, currency) {

  /* ------------------------------------------------------------------ */

  /* ------------------------------------------------------------------ */

  function calcOrder(order) {
    var o = order || {};
    var items = Array.isArray(o.items) ? o.items : [];
    var totalQty = 0;
    var totalCartons = 0;
    var totalNetWeight = 0;
    var totalGrossWeight = 0;
    var totalCbm = 0;
    var merchandiseTotal = 0;

    var lines = items.map(function (item) {
      var it = item || {};
      var qty = num(it.qty, 0);
      var unitPrice = num(it.unitPrice, 0);
      var amount = round(qty * unitPrice, 2);
      var perCarton = num(it.qtyPerCarton, 0);
      var cartons = num(it.cartons, 0);
      if (!cartons && perCarton > 0 && qty > 0) cartons = Math.ceil(qty / perCarton);
      cartons = Math.max(0, cartons);
      var netTotal = round(cartons * num(it.netWeight, 0), 3);
      var grossTotal = round(cartons * num(it.grossWeight, 0), 3);
      var cbmTotal = round(cartons * num(it.cbm, 0), 3);
      totalQty += qty;
      totalCartons += cartons;
      totalNetWeight += netTotal;
      totalGrossWeight += grossTotal;
      totalCbm += cbmTotal;
      merchandiseTotal += amount;
      return Object.assign({}, it, {
        amount: amount,
        cartonsCalc: cartons,
        netWeightTotal: netTotal,
        grossWeightTotal: grossTotal,
        cbmTotal: cbmTotal

    merchandiseTotal = round(merchandiseTotal, 2);
    totalQty = round(totalQty, 3);
    totalCartons = round(totalCartons, 3);
    totalNetWeight = round(totalNetWeight, 3);
    totalGrossWeight = round(totalGrossWeight, 3);
    totalCbm = round(totalCbm, 3);

    var charges = o.charges || {};
    var freight = round(num(charges.freight, 0), 2);
    var insurance = round(num(charges.insurance, 0), 2);
    var other = round(num(charges.other, 0), 2);
    var discount = round(num(charges.discount, 0), 2);
    var grandTotal = round(merchandiseTotal + freight + insurance + other - discount, 2);
    if (grandTotal < 0) grandTotal = 0;
    var currency = o.currency || 'USD';

    return {
      lines: lines,
      totalQty: totalQty,
      totalCartons: totalCartons,
      totalNetWeight: totalNetWeight,
      totalGrossWeight: totalGrossWeight,
      totalCbm: totalCbm,
      merchandiseTotal: merchandiseTotal,
      freight: freight,
      insurance: insurance,
      other: other,
      discount: discount,
      grandTotal: grandTotal,
      amountInWordsEn: amountWordsEn(grandTotal, currency),
      amountInWordsCn: amountWordsCn(grandTotal, currency)

  function calcCost(order) {
    var o = order || {};
    var revenue = calcOrder(o);
    var cost = o.cost || {};
    var exchangeRate = num(cost.exchangeRate, 7.1);
    if (!(exchangeRate > 0)) exchangeRate = 7.1;
    var revenueFc = revenue.grandTotal;
    var revenueCny = round(revenueFc * exchangeRate, 2);
    var purchaseCost = 0;
    revenue.lines.forEach(function (line) {

    var domesticCost = round(num(cost.domestic, 0), 2);
    var bankCost = round(num(cost.bank, 0), 2);
    var miscCost = round(num(cost.misc, 0), 2);

    var grossProfit = round(revenueCny - totalCost, 2);
    var marginPct = revenueCny > 0 ? round((grossProfit / revenueCny) * 100, 2) : 0;
    return {
      revenueFc: revenueFc,
      exchangeRate: exchangeRate,
      revenueCny: revenueCny,
      purchaseCost: purchaseCost,
      domesticCost: domesticCost,
      bankCost: bankCost,
      miscCost: miscCost,
      totalCost: totalCost,
      grossProfit: grossProfit,

  /* ------------------------------------------------------------------ */

  function validateOrder(order) {

    function add(level, field, message) { issues.push({ level: level, field: field, message: message }); }

    if (!String(buyer.nameEn || buyer.nameCn || '').trim()) {

    if (!String(o.no || '').trim()) add('warn', 'no', '尚未生成订单号');

    var items = Array.isArray(o.items) ? o.items : [];
    if (!items.length) add('error', 'items', '请至少添加一项货物');
    items.forEach(function (item, index) {

    if (value === null || value === undefined) return null;
    var s = asString(value).replace(/[.,;:!?]+$/g, '').trim().toLowerCase();
    if (!s) return null;
    if (COUNTRY_LOOKUP[s]) return COUNTRY_LOOKUP[s];
    var keys = Object.keys(COUNTRY_LOOKUP);
    for (var i = 0; i < keys.length; i++) {
      var alias = keys[i];
      if (alias.length < 3) continue;
      if (s === alias || s.slice(-(alias.length + 1)) === ' ' + alias) return COUNTRY_LOOKUP[alias];
    }
    return null;
  }

  function inferCountryFromLines(lines) {
    if (!Array.isArray(lines)) return null;
    for (var i = lines.length - 1; i >= 0; i--) {
      var line = collapseSpaces(lines[i]);
      if (!line) continue;
      var code = normalizeCountryName(line);
      if (code) return code;
      var tail = /([A-Za-z. ]{3,})$/.exec(line);
      if (tail) {
        code = normalizeCountryName(tail[1]);
        if (code) return code;
      }
    }
    return null;
  }

  function cleanValue(raw) {
    var s = asString(raw).replace(/[\u00a0\u3000]/g, ' ').trim();
    s = s.replace(/^[\s:：\-–—|,;]+/, '').replace(/[\s,;:：\-–—|]+$/, '');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  function cleanPlace(raw) {
    var s = cleanValue(raw);
    if (!s) return null;
    return hasCJK(s) ? s : s.toUpperCase();
  }

  function normNameKey(value) {
    return asString(value).toUpperCase().replace(/[^A-Z0-9\u3400-\u9fff]/g, '');
  }

  /* ================================================================== */
  /*  5. ZIP reader (central directory + DecompressionStream)            */
  /* ================================================================== */

  function decodeText(bytes) {
    if (typeof TextDecoder === 'function') {
      try {
        return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
      } catch (e) { /* fall through */ }
    }
    var out = '';
    for (var i = 0; i < bytes.length; i++) out += String.fromCharCode(bytes[i]);
    return out;
  }

  function decodeZipName(bytes, flags) {
    try {
      var name = decodeText(bytes);
      if ((flags & 0x800) || name.indexOf('\uFFFD') === -1) return name;
      var out = '';
      for (var i = 0; i < bytes.length; i++) out += String.fromCharCode(bytes[i]);
      return out;
    } catch (e) {
      return '';
    }
  }

  function readU16(bytes, offset) {
    return bytes[offset] | (bytes[offset + 1] << 8);
  }

  function readU32(bytes, offset) {
    return (bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0;
  }

  function readZipDirectory(bytes) {
    var out = { entries: [], warnings: [] };
    function warn(code, message) { out.warnings.push({ code: code, message: message }); }
    if (!bytes || bytes.length < 22) {
      warn('zip-invalid', 'ZIP 文件结构无效（文件过小），无法读取文档内容。');
      return out;
    }
    var eocd = -1;
    var min = Math.max(0, bytes.length - 22 - 65535);
    for (var i = bytes.length - 22; i >= min; i--) {
      if (readU32(bytes, i) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) {
      warn('zip-invalid', '未找到 ZIP 目录（文件可能已损坏或不是有效的 Office 文档）。');
      return out;
    }
    var total = readU16(bytes, eocd + 10);
    var cdOffset = readU32(bytes, eocd + 16);
    if (total === 0xffff || cdOffset === 0xffffffff) {
      warn('zip64-unsupported', '文件使用 ZIP64 格式，当前版本暂不支持解析。');
      return out;
    }
    var p = cdOffset;
    var count = 0;
    while (p + 46 <= bytes.length && count < total) {
      if (readU32(bytes, p) !== 0x02014b50) {
        warn('zip-invalid', 'ZIP 中央目录损坏，仅能读取部分内容。');
        break;
      }
      var flags = readU16(bytes, p + 8);
      var method = readU16(bytes, p + 10);
      var compSize = readU32(bytes, p + 20);
      var uncompSize = readU32(bytes, p + 24);
      var nameLen = readU16(bytes, p + 28);
      var extraLen = readU16(bytes, p + 30);
      var commentLen = readU16(bytes, p + 32);
      var localOffset = readU32(bytes, p + 42);
      if (p + 46 + nameLen > bytes.length) {
        warn('zip-invalid', 'ZIP 中央目录条目越界，文件可能已损坏。');
        break;
      }
      var name = decodeZipName(bytes.subarray(p + 46, p + 46 + nameLen), flags);
      if (name && name.charAt(name.length - 1) !== '/') {
        out.entries.push({
          name: name.replace(/\\/g, '/'),
          method: method,
          compSize: compSize,
          uncompSize: uncompSize,
          localOffset: localOffset,
          flags: flags
        });
      }
      p += 46 + nameLen + extraLen + commentLen;
      count++;
    }
    if (!out.entries.length && !out.warnings.length) {
      warn('zip-invalid', 'ZIP 中没有可读取的文件条目。');
    }
    return out;
  }

  function inflateRaw(bytes) {
    return new Promise(function (resolve, reject) {
      try {
        if (typeof DecompressionStream !== 'function') {
          reject(new Error('当前环境不支持解压（DecompressionStream 不可用）'));
          return;
        }
        if (typeof Blob !== 'function' || typeof Response !== 'function') {
          reject(new Error('当前环境不支持解压所需的 Blob/Response'));
          return;
        }
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
        new Response(stream).arrayBuffer().then(function (ab) {
          resolve(new Uint8Array(ab));
        }).catch(reject);
      } catch (e) {
        reject(e);
      }
    });
  }

  async function readZipEntry(bytes, entry) {
    if (!entry) throw new Error('条目不存在');
    if (entry.flags & 0x0001) throw new Error('文件已加密，无法读取');
    if (entry.uncompSize > 64 * 1024 * 1024) throw new Error('单个文件解压后过大');
    var offset = entry.localOffset;
    if (offset + 30 > bytes.length) throw new Error('本地文件头越界');
    if (readU32(bytes, offset) !== 0x04034b50) throw new Error('本地文件头无效');
    var nameLen = readU16(bytes, offset + 26);
    var extraLen = readU16(bytes, offset + 28);
    var start = offset + 30 + nameLen + extraLen;
    var end = start + entry.compSize;
    if (end > bytes.length) throw new Error('压缩数据越界');
    var data = bytes.subarray(start, end);
    if (entry.method === 0) return data;
    if (entry.method === 8) {
      var inflated = await inflateRaw(data);
      if (inflated.length > 64 * 1024 * 1024) throw new Error('解压后内容过大');
      return inflated;
    }
    throw new Error('不支持的压缩方式：' + entry.method);
  }

  function findZipEntry(entries, wantedPath) {
    var normalized = asString(wantedPath).replace(/\\/g, '/').replace(/^\//, '').toLowerCase();
    for (var i = 0; i < entries.length; i++) {
      var name = entries[i].name.replace(/^\//, '').toLowerCase();
      if (name === normalized) return entries[i];
    }
    return null;
  }

  /* ================================================================== */
  /*  6. XML helpers                                                     */
  /* ================================================================== */

  function decodeEntities(value) {
    return asString(value).replace(/&#x([0-9a-fA-F]+);/g, function (m, hex) {
      var code = parseInt(hex, 16);
      if (!Number.isFinite(code) || code < 0 || code > 0x10ffff) return m;
      try { return String.fromCodePoint(code); } catch (e) { return m; }
    }).replace(/&#(\d+);/g, function (m, dec) {
      var code = parseInt(dec, 10);
      if (!Number.isFinite(code) || code < 0 || code > 0x10ffff) return m;
      try { return String.fromCodePoint(code); } catch (e) { return m; }
    }).replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"')
      .replace(/&apos;/g, "'").replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&');
  }

  function xmlAttr(attrs, name) {
    if (!attrs) return '';
    var escaped = asString(name).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    var re = new RegExp('(?:^|\\s)' + escaped + '\\s*=\\s*"([^"]*)"');
    var m = re.exec(attrs);
    return m ? decodeEntities(m[1]) : '';
  }

  function findMatchingClose(source, start, tagName) {
    var re = new RegExp('<(\\/?)' + tagName + '\\b[^>]*>', 'g');
    re.lastIndex = start;
    var depth = 0;
    var m;
    while ((m = re.exec(source))) {
      if (m[1] === '/') {
        depth--;
        if (depth === 0) return m.index + m[0].length;
      } else if (!/\/>$/.test(m[0])) {
        depth++;
      }
    }
    return -1;
  }

  /* ================================================================== */
  /*  7. DOCX extraction                                                 */
  /* ================================================================== */

  function wordParagraphText(paragraphXml) {
    var parts = [];
    var re = /<w:t\b[^>]*>([\s\S]*?)<\/w:t>|<w:t\b[^>]*\/>|<w:tab\b[^>]*\/?>|<w:(?:br|cr)\b[^>]*\/?>/g;
    var m;
    while ((m = re.exec(paragraphXml))) {
      if (m[1] !== undefined) parts.push(decodeEntities(m[1]));
      else if (/^<w:tab/.test(m[0])) parts.push('\t');
      else if (/^<w:t\b/.test(m[0])) parts.push('');
      else parts.push('\n');
    }
    return parts.join('').replace(/[ \t]+$/g, '');
  }

  function wordTableRows(tableXml) {
    var rows = [];
    var trRe = /<w:tr\b[^>]*>/g;
    var trMatch;
    while ((trMatch = trRe.exec(tableXml))) {
      if (/\/>$/.test(trMatch[0])) continue;
      var trEnd = findMatchingClose(tableXml, trMatch.index, 'w:tr');
      if (trEnd < 0) break;
      var rowXml = tableXml.slice(trMatch.index, trEnd);
      var cells = [];
      var tcRe = /<w:tc\b[^>]*>/g;
      var tcMatch;
      while ((tcMatch = tcRe.exec(rowXml))) {
        if (/\/>$/.test(tcMatch[0])) continue;
        var tcEnd = findMatchingClose(rowXml, tcMatch.index, 'w:tc');
        if (tcEnd < 0) break;
        var cellXml = rowXml.slice(tcMatch.index, tcEnd);
        var paragraphs = [];
        var pRe = /<w:p\b[^>]*>/g;
        var pMatch;
        while ((pMatch = pRe.exec(cellXml))) {
          if (/\/>$/.test(pMatch[0])) { paragraphs.push(''); continue; }
          var pEnd = findMatchingClose(cellXml, pMatch.index, 'w:p');
          if (pEnd < 0) break;
          paragraphs.push(wordParagraphText(cellXml.slice(pMatch.index, pEnd)));
        }
        var cellText = paragraphs.map(function (t) { return t.replace(/[\t\n\r]+/g, ' '); }).join(' ');
        cells.push(collapseSpaces(cellText));
      }
      if (cells.length) rows.push(cells);
      trRe.lastIndex = trEnd;
    }
    return rows;
  }

  function parseWordXml(xml) {
    var out = { text: '', tables: [] };
    if (!xml) return out;
    var body = xml;
    var bodyMatch = /<w:body\b[^>]*>([\s\S]*)<\/w:body>/.exec(xml);
    if (bodyMatch) body = bodyMatch[1];
    var lines = [];
    var pos = 0;
    // Capture the complete start tag so self-closing `<w:p/>` / `<w:tbl/>`
    // can be detected without consuming the following block (empty paragraphs
    // between tables are common in real Word documents).
    var blockRe = /<(w:p|w:tbl)\b[^>]*>/g;
    while (pos < body.length) {
      blockRe.lastIndex = pos;
      var m = blockRe.exec(body);
      if (!m) break;
      if (m[1] === 'w:tbl') {
        if (/\/>$/.test(m[0])) { pos = m.index + m[0].length; continue; }
        var tblEnd = findMatchingClose(body, m.index, 'w:tbl');
        if (tblEnd < 0) break;
        var tblXml = body.slice(m.index, tblEnd);
        var rows = wordTableRows(tblXml);
        if (rows.length) {
          out.tables.push(rows);
          lines.push(rows.map(function (row) { return row.join('\t'); }).join('\n'));
        }
        pos = tblEnd;
      } else {
        if (/\/>$/.test(m[0])) { lines.push(''); pos = m.index + m[0].length; continue; }
        var pEnd = findMatchingClose(body, m.index, 'w:p');
        if (pEnd < 0) break;
        lines.push(wordParagraphText(body.slice(m.index, pEnd)));
        pos = pEnd;
      }
    }
    out.text = lines.join('\n').replace(/\n{3,}/g, '\n\n').replace(/[ \t]+\n/g, '\n').trim();
    return out;
  }

  async function extractDocxText(bytes) {
    var out = { text: '', tables: [], warnings: [] };
    function warn(code, message) { out.warnings.push({ code: code, message: message }); }
    if (!bytes || bytes.length < 22) {
      warn('docx-invalid', '无法读取 Word 文件：内容为空或已损坏。');
      return out;
    }
    var zip = readZipDirectory(bytes);
    out.warnings = out.warnings.concat(zip.warnings);
    if (!zip.entries.length) {
      if (!out.warnings.length) warn('docx-invalid', 'Word 文件结构无效，无法解析。');
      return out;
    }
    var entry = findZipEntry(zip.entries, 'word/document.xml');
    if (!entry) {
      warn('docx-invalid', '未找到 word/document.xml，文件可能不是有效的 .docx。');
      return out;
    }
    var xmlBytes;
    try {
      xmlBytes = await readZipEntry(bytes, entry);
    } catch (e) {
      warn('docx-invalid', '解压 Word 内容失败：' + (e && e.message ? e.message : '未知错误'));
      return out;
    }
    if (xmlBytes.length > 64 * 1024 * 1024) {
      warn('docx-too-large', 'Word 文档内容过大，已跳过解析。');
      return out;
    }
    var parsed = parseWordXml(decodeText(xmlBytes));
    out.text = parsed.text;
    out.tables = parsed.tables;
    if (!out.text && !out.tables.length) warn('docx-empty', 'Word 文档中没有可识别的文字。');
    return out;
  }

  /* ================================================================== */
  /*  8. XLSX extraction                                                 */
  /* ================================================================== */

  function parseSharedStringsXml(xml) {
    var list = [];
    if (!xml) return list;
    var re = /<si\b[^>]*>([\s\S]*?)<\/si>/g;
    var m;
    while ((m = re.exec(xml))) {
      var si = m[1];
      var text = '';
      var tRe = /<t\b[^>]*>([\s\S]*?)<\/t>|<t\b[^>]*\/>/g;
      var tm;
      while ((tm = tRe.exec(si))) {
        if (tm[1] !== undefined) text += decodeEntities(tm[1]);
      }
      list.push(text);
    }
    return list;
  }

  function parseWorkbookSheetsXml(xml) {
    var sheets = [];
    if (!xml) return sheets;
    var re = /<sheet\b([^>]*?)\/?>/g;
    var m;
    while ((m = re.exec(xml))) {
      var attrs = m[1] || '';
      var name = xmlAttr(attrs, 'name');
      var rid = xmlAttr(attrs, 'r:id');
      if (!name) continue;
      sheets.push({ name: name, rid: rid });
    }
    return sheets;
  }

  function parseRelationshipsXml(xml) {
    var map = {};
    if (!xml) return map;
    var re = /<Relationship\b([^>]*?)\/?>/g;
    var m;
    while ((m = re.exec(xml))) {
      var attrs = m[1] || '';
      var id = xmlAttr(attrs, 'Id');
      var target = xmlAttr(attrs, 'Target');
      if (id && target) map[id] = target;
    }
    return map;
  }

  function normalizeZipPath(path) {
    var parts = asString(path).replace(/\\/g, '/').split('/');
    var stack = [];
    parts.forEach(function (part) {
      if (!part || part === '.') return;
      if (part === '..') stack.pop();
      else stack.push(part);
    });
    return stack.join('/');
  }

  function resolveSheetPath(target) {
    var t = asString(target).replace(/\\/g, '/');
    if (!t) return '';
    if (t.charAt(0) === '/') return normalizeZipPath(t.slice(1));
    if (/^xl\//.test(t)) return normalizeZipPath(t);
    return normalizeZipPath('xl/' + t);
  }

  function columnIndexFromRef(ref) {
    var m = /^([A-Z]+)/i.exec(asString(ref));
    if (!m) return -1;
    var letters = m[1].toUpperCase();
    var index = 0;
    for (var i = 0; i < letters.length; i++) index = index * 26 + (letters.charCodeAt(i) - 64);
    return index - 1;
  }

  function sheetTagText(inner, tag) {
    var re = new RegExp('<' + tag + '\\b[^>]*>([\\s\\S]*?)<\\/' + tag + '>', 'i');
    var m = re.exec(inner);
    return m ? decodeEntities(m[1]) : '';
  }

  function sheetAllText(inner) {
    var text = '';
    var re = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
    var m;
    while ((m = re.exec(inner))) text += decodeEntities(m[1]);
    return text;
  }

  function parseSheetRowsXml(xml, sharedStrings) {
    var rows = [];
    if (!xml) return rows;
    var prevRowNum = 0;
    var rowRe = /<row\b([^>]*?)(?:\/>|>([\s\S]*?)<\/row>)/g;
    var rowMatch;
    while ((rowMatch = rowRe.exec(xml))) {
      var rowAttrs = rowMatch[1] || '';
      var rowInner = rowMatch[2] || '';
      var rowNum = parseInt(xmlAttr(rowAttrs, 'r'), 10);
      if (Number.isFinite(rowNum) && prevRowNum && rowNum > prevRowNum + 1) rows.push([]);
      if (Number.isFinite(rowNum)) prevRowNum = rowNum;
      var cells = [];
      var cellRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g;
      var cellMatch;
      while ((cellMatch = cellRe.exec(rowInner))) {
        var cellAttrs = cellMatch[1] || '';
        var cellInner = cellMatch[2] || '';
        var type = asString(xmlAttr(cellAttrs, 't')).toLowerCase();
        var ref = xmlAttr(cellAttrs, 'r');
        var colIdx = ref ? columnIndexFromRef(ref) : cells.length;
        if (colIdx < 0) colIdx = cells.length;
        var value = '';
        if (type === 's') {
          var idx = parseInt(sheetTagText(cellInner, 'v'), 10);
          if (Number.isFinite(idx) && sharedStrings[idx] !== undefined) value = sharedStrings[idx];
        } else if (type === 'inlinestr') {
          value = sheetAllText(cellInner);
        } else if (type === 'b') {
          value = sheetTagText(cellInner, 'v') === '1' ? 'TRUE' : 'FALSE';
        } else {
          value = sheetTagText(cellInner, 'v');
          if (type === 'e') value = value || '#ERROR';
        }
        cells[colIdx] = value;
      }
      var width = 0;
      for (var i = 0; i < cells.length; i++) if (cells[i] !== undefined) width = i + 1;
      var arr = [];
      for (var j = 0; j < width; j++) arr.push(cells[j] === undefined ? '' : asString(cells[j]));
      rows.push(arr.length ? arr : []);
    }
    while (rows.length && rows[rows.length - 1].length === 0) rows.pop();
    return rows;
  }

  async function extractXlsxText(bytes) {
    var out = { text: '', tables: [], warnings: [] };
    function warn(code, message) { out.warnings.push({ code: code, message: message }); }
    if (!bytes || bytes.length < 22) {
      warn('xlsx-invalid', '无法读取 Excel 文件：内容为空或已损坏。');
      return out;
    }
    var zip = readZipDirectory(bytes);
    out.warnings = out.warnings.concat(zip.warnings);
    if (!zip.entries.length) {
      if (!out.warnings.length) warn('xlsx-invalid', 'Excel 文件结构无效，无法解析。');
      return out;
    }

    async function entryText(path) {
      var entry = findZipEntry(zip.entries, path);
      if (!entry) return '';
      try {
        var data = await readZipEntry(bytes, entry);
        return decodeText(data);
      } catch (e) {
        warn('xlsx-invalid', '读取 ' + path + ' 失败：' + (e && e.message ? e.message : '未知错误'));
        return '';
      }
    }

    var sharedXml = await entryText('xl/sharedStrings.xml');
    var sharedStrings = parseSharedStringsXml(sharedXml);
    var workbookXml = await entryText('xl/workbook.xml');
    var relsXml = await entryText('xl/_rels/workbook.xml.rels');
    var rels = parseRelationshipsXml(relsXml);
    var sheets = parseWorkbookSheetsXml(workbookXml);
    if (!sheets.length) {
      var fallback = [];
      zip.entries.forEach(function (entry) {
        var m = /^xl\/worksheets\/(sheet\d+)\.xml$/i.exec(entry.name);
        if (m) fallback.push({ name: m[1], rid: '', sortKey: parseInt(m[1].replace(/\D+/g, ''), 10) || 0 });
      });
      fallback.sort(function (a, b) { return a.sortKey - b.sortKey; });
      sheets = fallback.map(function (s) { return { name: s.name, rid: '' }; });
      if (!sheets.length) {
        warn('xlsx-invalid', 'Excel 文件中没有可读取的工作表。');
        return out;
      }
      warn('xlsx-partial', '未能读取工作簿结构，已按默认顺序解析工作表。');
    }

    var textParts = [];
    var tableRows = [];
    var totalRows = 0;
    var sheetLimit = Math.min(sheets.length, 50);
    for (var s = 0; s < sheetLimit; s++) {
      var sheet = sheets[s];
      var target = sheet.rid && rels[sheet.rid] ? rels[sheet.rid] : ('worksheets/sheet' + (s + 1) + '.xml');
      var sheetPath = resolveSheetPath(target);
      var sheetXml = await entryText(sheetPath);
      if (!sheetXml) {
        var fallbackPath = 'xl/worksheets/sheet' + (s + 1) + '.xml';
        if (sheetPath !== fallbackPath) sheetXml = await entryText(fallbackPath);
      }
      if (!sheetXml) {
        warn('xlsx-partial', '工作表“' + sheet.name + '”读取失败。');
        continue;
      }
      var rows = parseSheetRowsXml(sheetXml, sharedStrings);
      if (!rows.length) continue;
      totalRows += rows.length;
      if (totalRows > 100000) {
        warn('xlsx-too-large', 'Excel 表格行数过多，已截断解析。');
        break;
      }
      var tsvLines = rows.map(function (row) { return row.join('\t'); });
      textParts.push('## Sheet: ' + sheet.name + '\n' + tsvLines.join('\n'));
      if (tableRows.length) tableRows.push([]);
      for (var r = 0; r < rows.length; r++) tableRows.push(rows[r]);
    }

    out.text = textParts.join('\n\n').trim();
    out.tables = tableRows;
    if (!out.text && !out.tables.length) warn('xlsx-empty', 'Excel 表格中没有可识别的文字。');
    return out;
  }

  /* ================================================================== */
  /*  9. CSV / TSV / JSON / Markdown extraction                          */
  /* ================================================================== */

  function sniffDelimiter(text, ext) {
    if (ext === '.tsv') return '\t';
    var firstLine = asString(text).split('\n').slice(0, 5).join('\n');
    var candidates = [',', ';', '\t', '|'];
    var best = ',';
    var bestCount = 0;
    candidates.forEach(function (candidate) {
      var count = 0;
      var inQuotes = false;
      for (var i = 0; i < firstLine.length; i++) {
        var ch = firstLine.charAt(i);
        if (ch === '"') inQuotes = !inQuotes;
        else if (!inQuotes && ch === candidate) count++;
      }
      if (count > bestCount) { best = candidate; bestCount = count; }
    });
    return best;
  }

  function parseDelimitedText(text, delimiter) {
    var rows = [];
    var row = [];
    var field = '';
    var inQuotes = false;
    var s = asString(text);
    var i = 0;
    while (i < s.length) {
      var ch = s.charAt(i);
      if (inQuotes) {
        if (ch === '"') {
          if (s.charAt(i + 1) === '"') { field += '"'; i += 2; continue; }
          inQuotes = false;
          i++;
          continue;
        }
        field += ch;
        i++;
        continue;
      }
      if (ch === '"') { inQuotes = true; i++; continue; }
      if (ch === delimiter) { row.push(collapseSpaces(field)); field = ''; i++; continue; }
      if (ch === '\r') { i++; continue; }
      if (ch === '\n') {
        row.push(collapseSpaces(field));
        rows.push(row);
        row = [];
        field = '';
        i++;
        continue;
      }
      field += ch;
      i++;
    }
    if (field !== '' || row.length) {
      row.push(collapseSpaces(field));
      rows.push(row);
    }
    while (rows.length) {
      var last = rows[rows.length - 1];
      var empty = true;
      for (var k = 0; k < last.length; k++) if (last[k] !== '') { empty = false; break; }
      if (empty) rows.pop();
      else break;
    }
    return rows;
  }

  function prettyKey(key) {
    var s = asString(key).replace(/[_-]+/g, ' ');
    s = s.replace(/([a-z0-9])([A-Z])/g, '$1 $2');
    s = s.replace(/([A-Z]+)([A-Z][a-z])/g, '$1 $2');
    s = collapseSpaces(s);
    if (!s) return '';
    return s.charAt(0).toUpperCase() + s.slice(1);
  }

  function jsonScalar(value) {
    if (value === null || value === undefined) return '';
    if (typeof value === 'string') return value;
    if (typeof value === 'number' || typeof value === 'boolean') return String(value);
    try { return JSON.stringify(value); } catch (e) { return ''; }
  }

  var PARTY_LABELS = {
    nameEn: 'Buyer',
    nameCn: 'Buyer Chinese Name',
    addressEn: 'Buyer Address',
    addressCn: 'Buyer Chinese Address',
    country: 'Buyer Country',
    contact: 'Buyer Contact',
    tel: 'Buyer Tel',
    email: 'Buyer Email',
    taxId: 'Buyer Tax ID'
  };

  function extractJsonText(value) {
    var out = { text: '', tables: [], warnings: [] };
    var lines = [];
    var tables = [];
    if (value === null || value === undefined) return out;

    function pushObjectArray(arr, prefix) {
      var keys = [];
      arr.forEach(function (obj) {
        Object.keys(obj).forEach(function (k) { if (keys.indexOf(k) < 0) keys.push(k); });
      });
      if (!keys.length) return;
      var rows = [keys.map(function (k) { return prettyKey(k) || k; })];
      arr.forEach(function (obj) {
        rows.push(keys.map(function (k) { return jsonScalar(obj[k]); }));
      });
      tables.push(rows);
      rows.forEach(function (row) { lines.push(row.join('\t')); });
    }

    function walk(node, depth) {
      if (depth > 6) return;
      if (Array.isArray(node)) {
        if (!node.length) return;
        var allObjects = true;
        var allArrays = true;
        var allScalars = true;
        node.forEach(function (item) {
          if (!(isPlainObject(item))) allObjects = false;
          if (!Array.isArray(item)) allArrays = false;
          if (isPlainObject(item) || Array.isArray(item)) allScalars = false;
        });
        if (allObjects) { pushObjectArray(node); return; }
        if (allArrays) {
          var rows = node.map(function (item) { return item.map(jsonScalar); });
          tables.push(rows);
          rows.forEach(function (row) { lines.push(row.join('\t')); });
          return;
        }
        if (allScalars) {
          var rows2 = [['Value']];
          node.forEach(function (item) { rows2.push([jsonScalar(item)]); });
          tables.push(rows2);
          rows2.forEach(function (row) { lines.push(row.join('\t')); });
          return;
        }
        node.forEach(function (item, index) { walk(item, depth + 1); });
        return;
      }
      if (isPlainObject(node)) {
        var keys = Object.keys(node);
        keys.forEach(function (key) {
          var val = node[key];
          var lowered = key.toLowerCase();
          if ((lowered === 'buyer' || lowered === 'seller') && isPlainObject(val)) {
            var labelFor = lowered === 'buyer' ? PARTY_LABELS : {
              nameEn: 'Seller', nameCn: 'Seller Chinese Name', addressEn: 'Seller Address',
              addressCn: 'Seller Chinese Address', country: 'Seller Country',
              contact: 'Seller Contact', tel: 'Seller Tel', email: 'Seller Email', taxId: 'Seller Tax ID'
            };
            var nameKey = val.nameEn !== undefined && val.nameEn !== null && val.nameEn !== '' ? 'nameEn'
              : (val.nameCn !== undefined && val.nameCn !== null && val.nameCn !== '' ? 'nameCn' : '');
            if (nameKey) lines.push(labelFor[nameKey] + ': ' + jsonScalar(val[nameKey]));
            Object.keys(val).forEach(function (field) {
              if (field === nameKey) return;
              var label = labelFor[field] || prettyKey(field);
              if (label) lines.push(label + ': ' + jsonScalar(val[field]));
            });
            return;
          }
          if (lowered === 'charges' && isPlainObject(val)) {
            Object.keys(val).forEach(function (field) {
              lines.push(prettyKey(field) + ': ' + jsonScalar(val[field]));
            });
            return;
          }
          if (isPlainObject(val) || Array.isArray(val)) {
            walk(val, depth + 1);
            return;
          }
          var label2 = prettyKey(key);
          if (label2) lines.push(label2 + ': ' + jsonScalar(val));
        });
        return;
      }
      lines.push(jsonScalar(node));
    }

    walk(value, 0);
    out.text = lines.join('\n');
    out.tables = tables;
    return out;
  }

  function markdownTables(text) {
    var lines = asString(text).split('\n');
    var tables = [];
    var i = 0;
    while (i < lines.length - 1) {
      var line = lines[i];
      var next = lines[i + 1];
      if (line.indexOf('|') >= 0 && /^\s*\|?\s*:?-{2,}/.test(next) && next.indexOf('|') >= 0) {
        var rows = [splitPipeRow(line)];
        var j = i + 2;
        while (j < lines.length && lines[j].trim() && lines[j].indexOf('|') >= 0) {
          rows.push(splitPipeRow(lines[j]));
          j++;
        }
        if (rows.length > 1) tables.push(rows);
        i = j;
        continue;
      }
      i++;
    }
    return tables;
  }

  function splitPipeRow(line) {
    var s = asString(line).trim();
    if (s.charAt(0) === '|') s = s.slice(1);
    if (s.charAt(s.length - 1) === '|') s = s.slice(0, -1);
    return s.split('|').map(function (cell) { return collapseSpaces(cell); });
  }

  /* ================================================================== */
  /*  10. File extraction                                                */
  /* ================================================================== */

  function extOf(name) {
    var m = /\.([A-Za-z0-9]+)\s*$/.exec(asString(name));
    return m ? '.' + m[1].toLowerCase() : '';
  }

  function unsupportedWarning(ext) {
    var message;
    if (ext === '.pdf') {
      message = '当前版本不支持 PDF（含扫描件）。请将文字内容复制粘贴，或另存为 TXT/Word/Excel 后重试。';
    } else if (IMAGE_EXTS.indexOf(ext) >= 0) {
      message = '当前版本不支持图片识别。请粘贴文字，或上传 TXT/Word/Excel 文件。';
    } else if (ext === '.doc' || ext === '.xls') {
      message = '当前版本不支持旧版 Office 格式（.doc/.xls）。请另存为 .docx/.xlsx，或粘贴文字。';
    } else {
      message = '不支持的文件类型' + (ext ? '（' + ext + '）' : '') + '。当前仅支持 TXT/MD/CSV/TSV/JSON/DOCX/XLSX。';
    }
    return { code: 'unsupported-format', message: message };
  }

  async function readFileText(file) {
    if (file && typeof file.text === 'function') {
      var text = await file.text();
      return asString(text);
    }
    var bytes = await readFileBytes(file);
    return decodeText(bytes);
  }

  async function readFileBytes(file) {
    if (file && typeof file.arrayBuffer === 'function') {
      var ab = await file.arrayBuffer();
      return new Uint8Array(ab);
    }
    if (file && typeof file.stream === 'function' && typeof Response === 'function') {
      var ab2 = await new Response(file.stream()).arrayBuffer();
      return new Uint8Array(ab2);
    }
    if (typeof file === 'string') return new TextEncoder().encode(file);
    throw new Error('无法读取文件内容');
  }

  function flattenTableList(tables) {
    var flat = [];
    (Array.isArray(tables) ? tables : []).forEach(function (table) {
      if (!Array.isArray(table)) return;
      var isNested = false;
      for (var i = 0; i < table.length; i++) {
        if (Array.isArray(table[i])) { isNested = true; break; }
      }
      if (isNested) {
        for (var j = 0; j < table.length; j++) {
          if (Array.isArray(table[j])) flat.push(table[j]);
        }
        flat.push([]);
      } else {
        flat.push(table);
      }
    });
    while (flat.length && Array.isArray(flat[flat.length - 1]) && flat[flat.length - 1].length === 0) flat.pop();
    return flat;
  }

  async function extractFile(file) {
    var name = 'file';
    var size = 0;
    var warnings = [];
    try {
      if (file && typeof file.name === 'string' && file.name) name = file.name;
    } catch (e) { /* ignore */ }
    try {
      if (file && typeof file.size === 'number' && Number.isFinite(file.size)) size = file.size;
    } catch (e2) { /* ignore */ }
    var ext = extOf(name);
    var result = { name: name, ext: ext, size: size, text: '', tables: [], warnings: warnings };

    if (file === null || file === undefined) {
      warnings.push({ code: 'read-failed', message: '文件对象为空，无法读取。' });
      return result;
    }
    if (!ext || ACCEPT.indexOf(ext) < 0) {
      warnings.push(unsupportedWarning(ext));
      return result;
    }
    if (size > MAX_FILE_BYTES) {
      warnings.push({
        code: 'file-too-large',
        message: '文件超过 10 MB 限制（' + Math.round(size / 1024) + ' KB），已跳过。'
      });
      return result;
    }

    try {
      if (ext === '.txt' || ext === '.md') {
        var text = normalizeText(await readFileText(file));
        if (ext === '.md') result.tables = flattenTableList(markdownTables(text));
        result.text = text;
      } else if (ext === '.csv' || ext === '.tsv') {
        var raw = normalizeText(await readFileText(file));
        var delimiter = sniffDelimiter(raw, ext);
        var rows = parseDelimitedText(raw, delimiter);
        result.tables = rows;
        result.text = rows.map(function (row) { return row.join('\t'); }).join('\n');
      } else if (ext === '.json') {
        var rawJson = normalizeText(await readFileText(file));
        var parsed;
        try {
          parsed = JSON.parse(rawJson);
        } catch (e3) {
          warnings.push({ code: 'json-invalid', message: 'JSON 解析失败，已按纯文本处理。' });
          result.text = rawJson;
          return result;
        }
        var jsonResult = extractJsonText(parsed);
        result.text = jsonResult.text;
        result.tables = flattenTableList(jsonResult.tables);
        if (!result.text && !result.tables.length) {
          warnings.push({ code: 'empty-file', message: 'JSON 中没有可识别的数据。' });
        }
      } else if (ext === '.docx') {
        var docxBytes = await readFileBytes(file);
        if (!size) result.size = docxBytes.length;
        if (docxBytes.length > MAX_FILE_BYTES) {
          warnings.push({ code: 'file-too-large', message: '文件超过 10 MB 限制，已跳过。' });
          return result;
        }
        var docxResult = await extractDocxText(docxBytes);
        result.text = docxResult.text;
        result.tables = docxResult.tables;
        result.warnings = result.warnings.concat(docxResult.warnings);
      } else if (ext === '.xlsx') {
        var xlsxBytes = await readFileBytes(file);
        if (!size) result.size = xlsxBytes.length;
        if (xlsxBytes.length > MAX_FILE_BYTES) {
          warnings.push({ code: 'file-too-large', message: '文件超过 10 MB 限制，已跳过。' });
          return result;
        }
        var xlsxResult = await extractXlsxText(xlsxBytes);
        result.text = xlsxResult.text;
        result.tables = xlsxResult.tables;
        result.warnings = result.warnings.concat(xlsxResult.warnings);
      }
    } catch (err) {
      warnings.push({
        code: 'read-failed',
        message: '读取文件失败：' + (err && err.message ? err.message : '未知错误')
      });
    }

    if (result.text.length > MAX_TEXT_CHARS) {
      result.text = result.text.slice(0, MAX_TEXT_CHARS);
      warnings.push({ code: 'text-truncated', message: '文件文本超过 300,000 字符，已截断。' });
    }
    if ((size === 0 && !result.text && !result.tables.length) || (file && file.size === 0)) {
      warnings.push({ code: 'empty-file', message: '文件内容为空。' });
    }
    return result;
  }

  async function extractFiles(fileList) {
    var out = { text: '', tables: [], files: [], warnings: [] };
    var list = [];
    try {
      if (fileList && typeof fileList.length === 'number') {
        for (var i = 0; i < fileList.length; i++) list.push(fileList[i]);
      } else if (fileList && typeof fileList === 'object') {
        list = [fileList];
      }
    } catch (e) {
      list = [];
    }
    if (!list.length) {
      out.warnings.push({ code: 'no-files', message: '未选择任何文件。' });
      return out;
    }
    var accepted = list.slice(0, MAX_FILES);
    if (list.length > MAX_FILES) {
      out.warnings.push({
        code: 'too-many-files',
        message: '最多支持 ' + MAX_FILES + ' 个文件，已忽略其余 ' + (list.length - MAX_FILES) + ' 个。'
      });
    }
    var parts = [];
    var tables = [];
    for (var f = 0; f < accepted.length; f++) {
      var file = accepted[f];
      var res;
      try {
        res = await extractFile(file);
      } catch (err) {
        res = {
          name: (file && file.name) || 'file',
          ext: extOf((file && file.name) || ''),
          size: 0,
          text: '',
          tables: [],
          warnings: [{ code: 'read-failed', message: '读取文件失败：' + (err && err.message ? err.message : '未知错误') }]
        };
      }
      (res.warnings || []).forEach(function (w) {
        out.warnings.push({ code: w.code, message: w.message, file: res.name });
      });
      out.files.push({
        name: res.name,
        ext: res.ext,
        size: res.size,
        chars: res.text.length,
        excerpt: makeExcerpt(res.text)
      });
      if (res.text) parts.push('===== FILE: ' + res.name + ' =====\n' + res.text);
      if (res.tables && res.tables.length) {
        for (var t = 0; t < res.tables.length; t++) {
          if (Array.isArray(res.tables[t])) tables.push(res.tables[t]);
        }
        tables.push([]);
      }
    }
    var combined = parts.join('\n\n');
    if (combined.length > MAX_TEXT_CHARS) {
      combined = combined.slice(0, MAX_TEXT_CHARS);
      out.warnings.push({ code: 'text-truncated', message: '合并文本超过 300,000 字符，已截断。' });
    }
    out.text = combined;
    out.tables = tables;
    if (!combined.trim()) {
      out.warnings.push({ code: 'no-text', message: '所选文件中没有可识别的文字。' });
    }
    return out;
  }

  function isMeaningful(value) {
    if (value === null || value === undefined) return false;
    if (typeof value === 'string') return value.trim().length > 0;
    if (typeof value === 'number') return Number.isFinite(value);
    return true;
  }

  function setField(rec, path, value, confidence, evidence) {
    if (!isMeaningful(value)) return false;
    var parts = asString(path).split('.');
    var target = rec.fields;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!target || typeof target !== 'object') return false;
      target = target[parts[i]];
    }
    if (!target || typeof target !== 'object') return false;
    var key = parts[parts.length - 1];
    var previousMeta = rec.meta[path];
    if (previousMeta && previousMeta.confidence > confidence && isMeaningful(target[key])) return false;
    target[key] = value;
    rec.meta[path] = { confidence: clampConfidence(confidence), evidence: makeEvidence(evidence || value) };
    return true;
  }

  function clearField(rec, path) {
    var parts = asString(path).split('.');
    var target = rec.fields;
    for (var i = 0; i < parts.length - 1; i++) {
      if (!target || typeof target !== 'object') return;
      target = target[parts[i]];
    }
    if (!target || typeof target !== 'object') return;
    target[parts[parts.length - 1]] = null;
    delete rec.meta[path];

  function buildLabelSource(alternatives) {
    var alt = '(?:' + alternatives.join('|') + ')';
    return alt + '(?:\\s*[\\/／|]\\s*' + alt + ')?';
  }

  function buildColonRegex(alternatives) {
    var label = buildLabelSource(alternatives);
    return new RegExp('^\\s*(?:[-*•·+>]\\s*)?(?:\\d{1,2}\\s*[.)、]\\s*)?' + label + '\\s*[:：]\\s*(.*)$', 'i');
  }

  function buildExactRegex(alternatives) {
    var label = buildLabelSource(alternatives);
    return new RegExp('^\\s*' + label + '\\s*[:：]?\\s*$', 'i');
  }

  function makeRule(field, type, confidence, labels, options) {
    var opts = options || {};
    var rule = {
      field: field,
      type: type,
      conf: confidence,
      labels: labels,
      continuation: opts.continuation === true
    };
    rule._colon = buildColonRegex(labels);
    rule._exact = buildExactRegex(labels);
    return rule;
  }

    makeRule('date', 'date', 0.9, ['(?:invoice|pi|ci|proforma|order|issue|signing|shipping|document|doc)?\\s*date(?:\\s*of\\s*issue)?', 'dated', '日期', '发票日期', '订单日期', '开单日期']),
    makeRule('etd', 'date', 0.9, ['e\\.?t\\.?d\\.?\\s*[\\/／&]\\s*e\\.?t\\.?a\\.?', 'e\\.?t\\.?d\\.?', 'estimated\\s*time\\s*of\\s*departure', 'estimated\\s*(?:departure|sailing)(?:\\s*(?:date|time))?', 'departure\\s*(?:date|time)', 'sailing\\s*(?:date|time)', '开船日期', '预计开船(?:日期)?', '离港日期']),
    makeRule('eta', 'date', 0.9, ['e\\.?t\\.?d\\.?\\s*[\\/／&]\\s*e\\.?t\\.?a\\.?', 'e\\.?t\\.?a\\.?', 'estimated\\s*time\\s*of\\s*arrival', 'estimated\\s*arrival(?:\\s*(?:date|time))?', 'arrival\\s*(?:date|time)', '到港日期', '预计到港(?:日期)?', '预计到达(?:日期)?', '抵港日期']),
    makeRule('currency', 'currency', 0.9, ['currency\\s*(?:code|name)?', 'settlement\\s*currency', '币种', '货币', '结算币种', '交易币种']),
    makeRule('incoterm', 'incoterm', 0.9, ['incoterms?', 'trade\\s*terms?', 'terms?\\s*of\\s*delivery', 'delivery\\s*terms?', 'price\\s*terms?', 'shipping\\s*terms?', '贸易术语', '价格条款', '成交方式', '交货条件']),
    makeRule('paymentTerms', 'text', 0.9, ['payment\\s*terms?', 'terms?\\s*of\\s*payment', 'payment\\s*(?:method|mode)?', '付款方式', '付款条件', '支付方式', '付款'], { continuation: true }),
    makeRule('transportMode', 'transport', 0.9, ['transport\\s*(?:mode|method)?', 'mode\\s*of\\s*transport', 'shipment\\s*(?:mode|method)', '运输方式', '运输工具', '装运方式']),
    makeRule('portOfLoading', 'place', 0.9, ['port\\s*of\\s*loading', 'port\\s*of\\s*shipment', 'loading\\s*port', 'shipment\\s*port', 'pol', '起运港', '装运港', '发货港', '起运口岸', '装运口岸']),
    makeRule('portOfDischarge', 'place', 0.9, ['port\\s*of\\s*discharge', 'port\\s*of\\s*destination', 'discharge\\s*port', 'destination\\s*port', 'pod', '目的港', '卸货港', '到达港', '目的口岸']),
    makeRule('finalDestination', 'place', 0.9, ['final\\s*destination', 'place\\s*of\\s*final\\s*destination', '最终目的地', '最终目的港']),
    makeRule('countryOfDestination', 'place', 0.9, ['country\\s*of\\s*destination', 'destination\\s*country', '目的国', '目的地国家', '目的国家']),
    makeRule('vessel', 'vessel', 0.9, ['ocean\\s*vessel', 'vessel\\s*(?:name)?', '船名', '船名航次', '轮船名称']),
    makeRule('voyage', 'id', 0.9, ['voyage\\s*(?:no\\.?|number)?', 'voy\\.?\\s*(?:no|number)\\.?', 'voy\\.?', '航次', '航次号']),
    makeRule('containerNo', 'id', 0.9, ['container\\s*(?:no|number|#)\\.?', 'container\\s*num', '柜号', '集装箱号', '箱号', '集装箱号码']),
    makeRule('sealNo', 'id', 0.9, ['seal\\s*(?:no|number|#)\\.?', '封号', '铅封号', '封条号']),
    makeRule('blNo', 'id', 0.9, ['(?:ocean\\s*)?b\\s*\\/?\\s*l\\s*(?:no|number|#)\\.?', 'bill\\s*of\\s*lading\\s*(?:no|number)', '提单号', '提单号码', '提单编号']),
    makeRule('bookingNo', 'id', 0.9, ['booking\\s*(?:no|number|ref|reference)?\\.?', '订舱号', '订舱编号', '订舱单号', '订舱确认号']),
    makeRule('charges.freight', 'money', 0.85, ['ocean\\s*freight', 'air\\s*freight', 'freight\\s*(?:charge|cost)?', '海运费', '空运费', '运费']),
    makeRule('charges.insurance', 'money', 0.85, ['insurance\\s*(?:premium|charge|cost|fee)?', '保险费', '保费']),
    makeRule('charges.other', 'money', 0.85, ['other\\s*(?:charges?|fees?|costs?|expenses?)', 'additional\\s*(?:charges?|fees?|costs?)', '其他费用', '其它费用', '杂费', '额外费用']),
    makeRule('charges.discount', 'money', 0.85, ['discounts?', '折扣', '优惠', '减价'])
  ];

  function splitCells(line) {
    var s = asString(line);
    if (!s) return [''];
    var parts;
    if (s.indexOf('\t') >= 0) parts = s.split('\t');
    else if (/ {2,}/.test(s)) parts = s.split(/ {2,}/);
    else return [s.trim()];
    var cells = parts.map(function (part) { return part.trim(); });
    while (cells.length && cells[0] === '') cells.shift();
    while (cells.length && cells[cells.length - 1] === '') cells.pop();
    return cells;
  }

  function trimIdValue(rec, raw) {
    var value = collapseSpaces(raw);
    if (!value) return '';
    var dateTail = /\s+(?:date|dated|invoice\s*date|l\s*\/?\s*c\s*date)\s*[:：]\s*(.+)$/i.exec(value);
    if (dateTail) {
      var iso = normalizeDate(dateTail[1]);
      if (iso) {
        setField(rec, 'date', iso, 0.85, dateTail[1]);
        value = value.slice(0, dateTail.index).trim();
      }
    }
    if (!value) return '';
    return value;
  }

  function splitVesselVoyage(rec, raw, confidence, evidence) {
    var value = collapseSpaces(raw);
    if (!value) return '';
    var voyage = null;
    var vessel = value;
    var labeled = /\s+(?:voyage|voy\.?|航次)\s*[:：]?\s*([A-Za-z0-9./\-]{1,16})\s*$/i.exec(value);
    if (labeled) {
      voyage = collapseSpaces(labeled[1]);
      vessel = value.slice(0, labeled.index).trim();
    } else {
      var slash = /^(.*?)\s*[\/|]\s*([A-Za-z0-9.]{1,16})\s*$/.exec(value);
      if (slash && /^(?:V?\.?\d{1,5}[A-Z]?|\d{1,4}[EWNS])$/i.test(slash[2])) {
        vessel = slash[1].trim();
        voyage = slash[2];
      }
    }
    if (!vessel) return '';
    if (voyage && !isMeaningful(rec.fields.voyage)) {
      setField(rec, 'voyage', voyage.toUpperCase(), confidence * 0.95, evidence || raw);
    }
    return vessel;
  }

  function handleRuleValue(rec, rule, raw, line, confidence) {
    var valueRaw = asString(raw).replace(/[\u00a0\u3000]/g, ' ').trim();
    if (!valueRaw) return false;
    var field = rule.field;
    var conf = confidence === undefined ? rule.conf : confidence;
    var evidence = line || valueRaw;
    var value;
    switch (rule.type) {
      case 'date':
        var dateList = extractDateList(valueRaw);
        value = dateList.length ? dateList[0] : normalizeDate(valueRaw);
        if (!value) return false;
        var dateSet = setField(rec, field, value, conf, evidence);
        // 同一行 "ETD/ETA: 2026-12-10 / 2026-12-24"：第二个日期归 ETA
        if (field === 'etd' && dateList.length > 1 && !isMeaningful(rec.fields.eta)) {
          setField(rec, 'eta', dateList[1], conf * 0.9, evidence);
        }
        return dateSet;
      case 'currency':
        value = normalizeCurrency(valueRaw);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
      case 'incoterm':
        value = normalizeIncoterm(valueRaw);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
      case 'transport':
        value = normalizeTransportMode(valueRaw);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
      case 'place':
        value = cleanPlace(valueRaw);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
      case 'money':
        value = parseMoney(valueRaw);
        if (!(value > 0)) return false;
        return setField(rec, field, roundTo(value, 2), conf, evidence);
      case 'id':
        if (field === 'containerNo') {
          var containerMatch = /[A-Z]{4}\d{7}/i.exec(valueRaw);
          if (containerMatch) valueRaw = containerMatch[0];
        }
        value = trimIdValue(rec, valueRaw);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
      case 'vessel':
        value = splitVesselVoyage(rec, valueRaw, conf, evidence);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
      default:
        value = cleanValue(valueRaw);
        if (!value) return false;
        return setField(rec, field, value, conf, evidence);
    }
  }

  function splitCombinedSegments(valueText) {
    var s = asString(valueText).replace(/[:：]\s*$/, '').trim();
    if (!s) return [];
    var attempts = [
      /\s+\/\s+|\s*[／｜|]\s*|\s{2,}/,
      /\s*[\/／｜|]\s*|\s{2,}/
    ];
    for (var a = 0; a < attempts.length; a++) {
      var parts = s.split(attempts[a]).map(function (part) { return part.trim(); }).filter(Boolean);
      if (parts.length > 1) return parts;
    }
    return [s];
  }

  function parseCombinedLabelRules(labelText) {
    var text = asString(labelText).replace(/[:：]\s*$/, '').trim();
    if (!text) return null;
    if (!/[\/／|]|\s{2,}/.test(text)) return null;
    var segments = splitCombinedSegments(text);
    if (segments.length < 2 || segments.length > 4) return null;
    var rules = [];
    var seenFields = {};
    for (var i = 0; i < segments.length; i++) {
      var found = null;
      for (var r = 0; r < FIELD_RULES.length; r++) {
        if (FIELD_RULES[r]._exact.test(segments[i])) { found = FIELD_RULES[r]; break; }
      }
      if (!found) return null;
      // 同字段的中英合并标签（如 "Port of Loading / 起运港"）不做拆分，回退原有单标签逻辑
      if (seenFields[found.field]) return null;
      seenFields[found.field] = true;
      rules.push(found);
    }
    return rules;
  }

  // 支持合并标签行，如 "Port of Loading / Port of Discharge" => "SHANGHAI / SYDNEY"、
  // "Vessel / Voyage" => "OOCL BRISBANE / V.118E"、"ETD / ETA" => "2026-12-18 / 2027-01-05"。
  // 仅在标签可完整拆分为已知字段且值可等分时才生效，其余情况返回 false 走原有单标签逻辑。
  function tryApplyCombinedFields(rec, labelText, valueText, rawLine) {
    var rules = parseCombinedLabelRules(labelText);
    if (!rules) return false;
    var values = splitCombinedSegments(valueText);
    if (values.length !== rules.length) return false;
    var applied = false;
    for (var i = 0; i < rules.length; i++) {
      if (handleRuleValue(rec, rules[i], values[i], rawLine, 0.85)) applied = true;
    }
    return applied;
  }

  function tryCombinedColonLine(rec, line) {
    var m = /^([^:：]+)[:：]\s*(.*)$/.exec(asString(line));
    if (!m) return false;
    return tryApplyCombinedFields(rec, m[1], m[2], line);
  }

  function applyRulesToCell(rec, cell, rawLine, confidence) {
    if (!cell) return;
    if (tryCombinedColonLine(rec, cell)) return;
    for (var r = 0; r < FIELD_RULES.length; r++) {
      var rule = FIELD_RULES[r];
      var m = rule._colon.exec(cell);
      if (!m) continue;
      var val = (m[1] || '').trim();
      if (!val) continue;
      if (handleRuleValue(rec, rule, val, rawLine, confidence === undefined ? rule.conf : confidence)) return;
    }
  }

  function nextContinuationValue(lines, index) {
    for (var i = index + 1; i < lines.length && i <= index + 3; i++) {
      var line = asString(lines[i]).trim();
      if (!line) continue;
      if (mapHeaderCells(splitCells(line)).mapped >= 3) return '';
      var isLabel = false;
      for (var r = 0; r < FIELD_RULES.length; r++) {
        if (FIELD_RULES[r]._colon.test(line)) { isLabel = true; break; }
      }
      if (isLabel || line.length > 160) return '';
      return line;
    }
    return '';
  }

  function extractGenericFields(rec, lines) {
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (!line || !line.trim()) continue;
      var cells = splitCells(line);
      if (cells.length > 1) {
        for (var c = 0; c < cells.length; c++) {
          applyRulesToCell(rec, cells[c], line);
        }
        for (var p = 0; p < cells.length - 1; p++) {
          if (tryApplyCombinedFields(rec, cells[p], cells[p + 1], line)) continue;
          for (var r = 0; r < FIELD_RULES.length; r++) {
            var rule = FIELD_RULES[r];
            if (!rule._exact.test(cells[p])) continue;
            var val = cells[p + 1];
            if (!val) break;
            if (handleRuleValue(rec, rule, val, line, 0.85)) break;
          }
        }
      } else {
        if (tryCombinedColonLine(rec, line)) continue;
        for (var r2 = 0; r2 < FIELD_RULES.length; r2++) {
          var rule2 = FIELD_RULES[r2];
          var m = rule2._colon.exec(line);
          if (!m) continue;
          var value = (m[1] || '').trim();
          if (!value && rule2.continuation) value = nextContinuationValue(lines, i);
          if (!value) continue;
          if (handleRuleValue(rec, rule2, value, line, rule2.conf)) break;
        }
      }
    }
  }

  /* ================================================================== */
  /*  13. Party blocks (seller / buyer) & free text blocks                */
  /* ================================================================== */

  var BUYER_LABELS = ['buyer\\s*(?:name)?', 'bill\\s*to', 'sold\\s*to', 'messrs\\.?', '买方名称', '买方', '客户名称', '客户', '购货单位', '购买方'];
  var BUYER_COLON = buildColonRegex(BUYER_LABELS);
  var BUYER_EXACT = buildExactRegex(BUYER_LABELS);
  var TO_LABEL = /^\s*(?:[-*•·+>]\s*)?to\s*[:：]\s*(.*)$/i;

  var SELLER_LABELS = ['seller\\s*(?:name)?', 'supplier\\s*(?:name)?', 'exporter', 'beneficiary', 'shipper', '卖方', '供应商', '出口商', '受益人', '发货人'];
  var SELLER_COLON = buildColonRegex(SELLER_LABELS);
  var SELLER_EXACT = buildExactRegex(SELLER_LABELS);

  var BUYER_BLOCK_STOP = /^(?:seller|supplier|exporter|beneficiary|shipper|consignee|notify|ship\s*to|deliver\s*to|卖方|供应商|出口商|受益人|发货人|收货人|通知人|通知方|提单|报关|承运人)/i;
  var SELLER_BLOCK_STOP = /^(?:buyer|bill\s*to|sold\s*to|consignee|notify|ship\s*to|deliver\s*to|买方|购货单位|收货人|通知人|通知方)/i;

  var CONTACT_SPECS = [
    {
      field: 'contact',
      colon: /^(?:contact(?:\s*(?:person|name))?|attn\.?|attention|联系人|经办人)\s*[:：]\s*(.*)$/i,
      exact: /^(?:contact(?:\s*(?:person|name))?|attn\.?|attention|联系人|经办人)$/i
    },
    {
      field: 'tel',
      colon: /^(?:tel\.?|telephone|phone|mobile|cell|电话|联系电话|手机|手机号)\s*[:：]\s*(.*)$/i,
      exact: /^(?:tel\.?|telephone|phone|mobile|cell|电话|联系电话|手机|手机号)$/i
    },
    {
      field: 'email',
      colon: /^(?:e-?mail|邮箱|电子邮箱|电子邮件)\s*[:：]\s*(.*)$/i,
      exact: /^(?:e-?mail|邮箱|电子邮箱|电子邮件)$/i
    },
    {
      field: 'taxId',
      colon: /^(?:tax\s*(?:id|no\.?|number)|vat\s*(?:no\.?|number)?|registration\s*(?:no\.?|number)|税号|统一社会信用代码|纳税人识别号)\s*[:：]\s*(.*)$/i,
      exact: /^(?:tax\s*(?:id|no\.?|number)|vat\s*(?:no\.?|number)?|registration\s*(?:no\.?|number)|税号|统一社会信用代码|纳税人识别号)$/i
    },
    {
      field: 'country',
      colon: /^(?:country|国家|国别)\s*[:：]\s*(.*)$/i,
      exact: /^(?:country|国家|国别)$/i
    },
    {
      field: 'address',
      colon: /^(?:address|add\.?|地址|详细地址|公司地址)\s*[:：]\s*(.*)$/i,
      exact: /^(?:address|add\.?|地址|详细地址|公司地址)$/i
    }
  ];

  function matchContactCell(cell, nextCell) {
    for (var i = 0; i < CONTACT_SPECS.length; i++) {
      var spec = CONTACT_SPECS[i];
      var m = spec.colon.exec(cell);
      if (m) {
        var value = cleanValue(m[1]);
        if (value) return { field: spec.field, value: value, skip: 0 };
      }
    }
    if (nextCell !== undefined) {
      for (var j = 0; j < CONTACT_SPECS.length; j++) {
        var spec2 = CONTACT_SPECS[j];
        if (spec2.exact.test(cell)) {
          var value2 = cleanValue(nextCell);
          if (value2) return { field: spec2.field, value: value2, skip: 1 };
        }
      }
    }
    return null;
  }

  function isDocTitleLine(line) {
    var s = collapseSpaces(line);
    if (!s || s.length > 60) return false;
    return /^(?:commercial\s+invoice|proforma\s+invoice|pro-forma\s+invoice|packing\s+list|sales\s+contract|contract|quotation|booking\s+note|shipping\s+advice|certificate|bill\s+of\s+exchange|customs|cost\s+sheet|invoice|装箱单|商业发票|形式发票|销售合同|报价单|订舱委托书|装运通知|原产地证|受益人证明|汇票|报关|成本核算)/i.test(s);
  }

  function looksLikeCompanyName(line) {
    var l = collapseSpaces(line);
    if (!l || l.length < 3 || l.length > 120) return false;
    if (/^\d/.test(l)) return false;
    if (/[@]/.test(l)) return false;
    if (/^(?:tel|fax|email|e-mail|phone|mobile|website|http)/i.test(l)) return false;
    if (/^(?:buyer|seller|supplier|exporter|shipper|consignee|notify|to|bill\s*to|sold\s*to|attn|contact|address|date|invoice|order|contract|payment|l\s*\/?\s*c|port|vessel|voyage|container|seal|booking|marks?|remarks?|notes?|currency|incoterm|transport|final\s*destination|country)\b/i.test(l)) return false;
    if (/^(?:买方|卖方|供应商|出口商|客户|收货人|通知人|通知方|日期|发票|订单|合同|付款|信用证|唛头|标记|备注|起运港|目的港|目的国|数量|单价|金额|品名|货物|运输方式)/.test(l)) return false;
    if (/^[\u4e00-\u9fff]{2,8}\s*[：:]/.test(l)) return false;
    var hasSuffix = /(?:co\.,?\s*ltd|company|limited|inc\.?|llc|gmbh|corp\.?|corporation|group|holdings?|industrial|trading|enterprise|import|export|imp\.?\s*&?\s*exp)/i.test(l);
    var hasCjkCompany = /(?:有限公司|株式会社|集团|工厂|制造厂)/.test(l);
    var allCaps = /^[A-Z0-9&.,'()\-\/ ]{6,}$/.test(l) && /[A-Z]{3}/.test(l);
    return hasSuffix || hasCjkCompany || allCaps;
  }

  function extractSeller(rec, lines) {
    var explicit = false;
    var startIndex = -1;

    for (var i = 0; i < lines.length; i++) {
      var line = asString(lines[i]).trim();
      if (!line) continue;
      var m = SELLER_COLON.exec(line);
      var nameValue = '';
      if (m) {
        nameValue = cleanValue(m[1]);
        startIndex = i;
      } else {
        var cells = splitCells(line);
        if (cells.length >= 2 && SELLER_EXACT.test(cells[0])) {
          nameValue = cleanValue(cells[1]);
          startIndex = i;
        }
      }
      if (!nameValue) continue;
      var nameParts = splitBilingualName(nameValue);
      if (nameParts.nameEn) setField(rec, 'seller.nameEn', nameParts.nameEn, 0.9, line);
      if (!nameParts.nameEn && nameParts.nameCn) setField(rec, 'seller.nameEn', nameParts.nameCn, 0.85, line);
      explicit = true;
      break;
    }

    var headerIndex = -1;
    if (!explicit) {
      var limit = Math.min(lines.length, 12);
      for (var h = 0; h < limit; h++) {
        var candidate = asString(lines[h]).trim();
        if (!candidate) continue;
        if (isDocTitleLine(candidate)) continue;
        if (isHardLabelLine(candidate)) break;
        if (looksLikeCompanyName(candidate)) { headerIndex = h; break; }
      }
      if (headerIndex < 0) return { explicit: false };
      var headerName = collapseSpaces(lines[headerIndex]);
      var headerParts = splitBilingualName(headerName);
      if (headerParts.nameEn) setField(rec, 'seller.nameEn', headerParts.nameEn, 0.6, headerName);
      else if (headerParts.nameCn) setField(rec, 'seller.nameEn', headerParts.nameCn, 0.6, headerName);
      startIndex = headerIndex;
    }

    if (startIndex < 0) return { explicit: explicit };

    var addrLines = [];
    var created = headerIndex < 0;
    var k = startIndex + 1;
    while (k < lines.length && k <= startIndex + 12) {
      var line2 = asString(lines[k]);
      if (!line2.trim()) break;
      var trimmed = line2.trim();
      if (BUYER_BLOCK_STOP.test(trimmed)) break;
      if (isDocTitleLine(trimmed)) break;
      var cells2 = splitCells(trimmed);
      var consumed = false;
      for (var ci = 0; ci < cells2.length; ci++) {
        var info = matchContactCell(cells2[ci], cells2[ci + 1]);
        if (!info) continue;
        consumed = true;
        if (info.field === 'address') {
          if (info.value) addrLines.push(info.value);
        } else if (info.field === 'country') {
          setField(rec, 'seller.country', normalizeCountryName(info.value) || cleanPlace(info.value), 0.8, trimmed);
        } else {
          setField(rec, 'seller.' + info.field, info.value, 0.85, trimmed);
        }
        ci += info.skip;
      }
      if (consumed) { k++; continue; }
      if (isHardLabelLine(trimmed)) break;
      if (hasCJK(trimmed) && /(?:有限公司|株式会社|公司)/.test(trimmed) && created) { k++; continue; }
      if (/(?:有限公司|株式会社|公司)/.test(trimmed) && !hasLatinWord(trimmed)) { k++; continue; }
      addrLines.push(trimmed);
      k++;
    }
    if (addrLines.length) {
      setField(rec, 'seller.addressEn', addrLines.join('\n'), 0.8, addrLines[0]);
